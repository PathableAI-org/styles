<!-- description: A solid PathAble Blue swatch at six opacity tokens. The label sits beside each swatch at full opacity so its contrast is unchanged. -->
<ul class="add-list-reset" role="list" aria-label="Opacity tokens">
  <li class="display-flex flex-align-center margin-bottom-1">
    <span
      class="display-block bg-primary opacity-0 width-6 height-4 margin-right-2"
      aria-hidden="true"
    ></span
    ><span class="text-ink"><code>opacity-0</code> 0</span>
  </li>
  <li class="display-flex flex-align-center margin-bottom-1">
    <span
      class="display-block bg-primary opacity-20 width-6 height-4 margin-right-2"
      aria-hidden="true"
    ></span
    ><span class="text-ink"><code>opacity-20</code> 0.2</span>
  </li>
  <li class="display-flex flex-align-center margin-bottom-1">
    <span
      class="display-block bg-primary opacity-40 width-6 height-4 margin-right-2"
      aria-hidden="true"
    ></span
    ><span class="text-ink"><code>opacity-40</code> 0.4</span>
  </li>
  <li class="display-flex flex-align-center margin-bottom-1">
    <span
      class="display-block bg-primary opacity-60 width-6 height-4 margin-right-2"
      aria-hidden="true"
    ></span
    ><span class="text-ink"><code>opacity-60</code> 0.6</span>
  </li>
  <li class="display-flex flex-align-center margin-bottom-1">
    <span
      class="display-block bg-primary opacity-80 width-6 height-4 margin-right-2"
      aria-hidden="true"
    ></span
    ><span class="text-ink"><code>opacity-80</code> 0.8</span>
  </li>
  <li class="display-flex flex-align-center margin-bottom-1">
    <span
      class="display-block bg-primary opacity-100 width-6 height-4 margin-right-2"
      aria-hidden="true"
    ></span
    ><span class="text-ink"><code>opacity-100</code> 1</span>
  </li>
</ul>
