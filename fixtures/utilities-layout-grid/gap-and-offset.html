<!-- description: A row with a large gap between columns. The pair of columns stacks on a phone and is centred with `tablet:grid-offset-2` from the tablet breakpoint. -->
<div class="grid-container">
  <div class="grid-row grid-gap-lg">
    <div class="grid-col-12 tablet:grid-col-4 tablet:grid-offset-2">
      <p>Morning sessions run from 9:00 AM to 12:00 PM.</p>
    </div>
    <div class="grid-col-12 tablet:grid-col-4">
      <p>Afternoon sessions run from 1:00 PM to 4:00 PM.</p>
    </div>
  </div>
</div>
