<!-- description: A service run by one organisation for another shows both logos, each linked to its own site. -->
<div class="pathable-identifier">
  <section
    class="pathable-identifier__section pathable-identifier__section--masthead"
    aria-label="Organisation identifier"
  >
    <div class="pathable-identifier__container">
      <div class="pathable-identifier__logos">
        <a class="pathable-identifier__logo" href="/">
          <img
            class="pathable-identifier__logo-img"
            src="/assets/img/pathable-logo.svg"
            alt="PathAble logo"
          />
        </a>
        <a
          class="pathable-identifier__logo"
          href="https://www.northriverworkforce.org/"
        >
          <img
            class="pathable-identifier__logo-img"
            src="/assets/img/north-river-workforce-logo.svg"
            alt="North River Workforce Board logo"
          />
        </a>
      </div>
      <div class="pathable-identifier__identity">
        <p class="pathable-identifier__identity-domain">app.pathable.ai</p>
        <p class="pathable-identifier__identity-disclaimer">
          A workforce case-management service operated by
          <a class="pathable-link" href="/about">PathAble</a> for the
          <a class="pathable-link" href="https://www.northriverworkforce.org/"
            >North River Workforce Board</a
          >
        </p>
      </div>
    </div>
  </section>
  <nav
    class="pathable-identifier__section pathable-identifier__section--required-links"
    aria-label="Organisation policies"
  >
    <div class="pathable-identifier__container">
      <ul class="pathable-identifier__required-links-list">
        <li class="pathable-identifier__required-links-item">
          <a
            class="pathable-identifier__required-link pathable-link"
            href="/about"
            >About PathAble</a
          >
        </li>
        <li class="pathable-identifier__required-links-item">
          <a
            class="pathable-identifier__required-link pathable-link"
            href="/accessibility"
            >Accessibility statement</a
          >
        </li>
        <li class="pathable-identifier__required-links-item">
          <a
            class="pathable-identifier__required-link pathable-link"
            href="/privacy"
            >Privacy policy</a
          >
        </li>
        <li class="pathable-identifier__required-links-item">
          <a
            class="pathable-identifier__required-link pathable-link"
            href="/terms"
            >Terms of use</a
          >
        </li>
      </ul>
    </div>
  </nav>
</div>
