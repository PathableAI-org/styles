<!-- description: A text suffix for a unit. The unit is hidden from assistive technology, so the label names it. -->
<form class="pathable-form">
  <label class="pathable-label" for="input-prefix-suffix-suffix-hours"
    >Hours worked this week</label
  >
  <div class="pathable-input-group">
    <input
      class="pathable-input"
      id="input-prefix-suffix-suffix-hours"
      name="hoursWorked"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
    />
    <div class="pathable-input-suffix" aria-hidden="true">hrs.</div>
  </div>
</form>
