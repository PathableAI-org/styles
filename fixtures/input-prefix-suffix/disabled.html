<!-- description: A disabled input. The affix is dimmed with the input and the group border changes in high-contrast mode. -->
<form class="pathable-form">
  <label class="pathable-label" for="input-prefix-suffix-disabled-wage"
    >Hourly wage, in dollars</label
  >
  <div class="pathable-input-group">
    <div class="pathable-input-prefix" aria-hidden="true">$</div>
    <input
      class="pathable-input"
      id="input-prefix-suffix-disabled-wage"
      name="hourlyWage"
      type="text"
      inputmode="decimal"
      value="18.50"
      disabled
    />
  </div>
  <label class="pathable-label" for="input-prefix-suffix-disabled-hours"
    >Hours worked this week</label
  >
  <div class="pathable-input-group">
    <input
      class="pathable-input"
      id="input-prefix-suffix-disabled-hours"
      name="hoursWorked"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      value="32"
      disabled
    />
    <div class="pathable-input-suffix" aria-hidden="true">hrs.</div>
  </div>
  <button type="submit" class="pathable-button">Save</button>
</form>
