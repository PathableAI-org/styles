<!-- description: An icon prefix inside the border of a text input. The icon is decorative and the label names the field. -->
<form class="pathable-form">
  <label class="pathable-label" for="input-prefix-suffix-prefix-icon-phone"
    >Participant mobile phone number</label
  >
  <div class="pathable-input-group">
    <div class="pathable-input-prefix" aria-hidden="true">
      <svg
        class="pathable-icon"
        aria-hidden="true"
        role="img"
        focusable="false"
      >
        <use href="/assets/img/sprite.svg#phone"></use>
      </svg>
    </div>
    <input
      class="pathable-input"
      id="input-prefix-suffix-prefix-icon-phone"
      name="mobilePhone"
      type="tel"
      autocomplete="tel"
    />
  </div>
</form>
