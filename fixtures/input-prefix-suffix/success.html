<!-- description: The success modifier on the group, for a value that has been checked and accepted. The border colour is not the only cue, so the message says so in words. -->
<div class="pathable-form-group">
  <label class="pathable-label" for="input-prefix-suffix-success-hours"
    >Hours worked this week, in hours</label
  >
  <span class="pathable-hint" id="input-prefix-suffix-success-hours-message"
    >Checked: 32 hours matches the timesheet.</span
  >
  <div class="pathable-input-group pathable-input-group--success">
    <input
      class="pathable-input"
      id="input-prefix-suffix-success-hours"
      name="hoursWorked"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      value="32"
      aria-describedby="input-prefix-suffix-success-hours-message"
    />
    <div class="pathable-input-suffix" aria-hidden="true">hrs.</div>
  </div>
</div>
