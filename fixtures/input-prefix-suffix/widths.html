<!-- description: Width modifiers on the group, to size a field to the value it holds. Each group is capped at the width its modifier names, from 2xs to 2xl. -->
<form class="pathable-form">
  <label class="pathable-label" for="input-prefix-suffix-widths-2xs"
    >Days per week</label
  >
  <div class="pathable-input-group pathable-input-group--2xs">
    <input
      class="pathable-input"
      id="input-prefix-suffix-widths-2xs"
      name="daysPerWeek"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
    />
    <div class="pathable-input-suffix" aria-hidden="true">days</div>
  </div>
  <label class="pathable-label" for="input-prefix-suffix-widths-xs"
    >Hours in the work placement</label
  >
  <div class="pathable-input-group pathable-input-group--xs">
    <input
      class="pathable-input"
      id="input-prefix-suffix-widths-xs"
      name="placementHours"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
    />
    <div class="pathable-input-suffix" aria-hidden="true">hrs.</div>
  </div>
  <label class="pathable-label" for="input-prefix-suffix-widths-sm"
    >Participant weight, in pounds</label
  >
  <div class="pathable-input-group pathable-input-group--sm">
    <input
      class="pathable-input"
      id="input-prefix-suffix-widths-sm"
      name="weight"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
    />
    <div class="pathable-input-suffix" aria-hidden="true">lbs.</div>
  </div>
  <label class="pathable-label" for="input-prefix-suffix-widths-md"
    >Monthly transportation stipend, in dollars</label
  >
  <div class="pathable-input-group pathable-input-group--md">
    <div class="pathable-input-prefix" aria-hidden="true">$</div>
    <input
      class="pathable-input"
      id="input-prefix-suffix-widths-md"
      name="stipend"
      type="text"
      inputmode="decimal"
    />
  </div>
  <label class="pathable-label" for="input-prefix-suffix-widths-lg"
    >Case worker phone number</label
  >
  <div class="pathable-input-group pathable-input-group--lg">
    <div class="pathable-input-prefix" aria-hidden="true">
      <svg
        class="pathable-icon"
        aria-hidden="true"
        role="img"
        focusable="false"
      >
        <use href="/assets/img/sprite.svg#phone"></use>
      </svg>
    </div>
    <input
      class="pathable-input"
      id="input-prefix-suffix-widths-lg"
      name="caseWorkerPhone"
      type="tel"
      autocomplete="tel"
    />
  </div>
  <label class="pathable-label" for="input-prefix-suffix-widths-xl"
    >Distance to placement, in miles</label
  >
  <div class="pathable-input-group pathable-input-group--xl">
    <input
      class="pathable-input"
      id="input-prefix-suffix-widths-xl"
      name="distance"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
    />
    <div class="pathable-input-suffix" aria-hidden="true">mi.</div>
  </div>
  <label class="pathable-label" for="input-prefix-suffix-widths-2xl"
    >Total hours across all placements</label
  >
  <div class="pathable-input-group pathable-input-group--2xl">
    <input
      class="pathable-input"
      id="input-prefix-suffix-widths-2xl"
      name="totalHours"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
    />
    <div class="pathable-input-suffix" aria-hidden="true">hrs.</div>
  </div>
  <button type="submit" class="pathable-button">Save</button>
</form>
