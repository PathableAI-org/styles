<!-- description: A text prefix for a currency symbol. The symbol is hidden from assistive technology, so the label names the unit. -->
<form class="pathable-form">
  <label class="pathable-label" for="input-prefix-suffix-prefix-text-wage"
    >Hourly wage, in dollars</label
  >
  <div class="pathable-input-group">
    <div class="pathable-input-prefix" aria-hidden="true">$</div>
    <input
      class="pathable-input"
      id="input-prefix-suffix-prefix-text-wage"
      name="hourlyWage"
      type="text"
      inputmode="decimal"
    />
  </div>
  <button type="submit" class="pathable-button">Save</button>
</form>
