<!-- description: Three panels written in reading order that display in a different order: order-first moves the notes panel ahead and order-last moves the summary panel behind. -->
<div class="display-flex">
  <div class="order-last flex-1 bg-base-lighter text-ink padding-2">
    <code>order-last</code> Participant summary
  </div>
  <div class="flex-1 bg-primary-lighter text-ink padding-2">
    Next appointment
  </div>
  <div class="order-first flex-1 bg-accent-cool-lighter text-ink padding-2">
    <code>order-first</code> Case notes
  </div>
</div>
