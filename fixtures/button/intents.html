<!-- description: The workflow intent modifiers. Save, continue, review and low-emphasis reuse the look of a colour modifier; destructive has its own danger fill. -->
<button type="button" class="pathable-button pathable-button--save">
  Save case notes
</button>
<button type="button" class="pathable-button pathable-button--continue">
  Continue to eligibility
</button>
<button type="button" class="pathable-button pathable-button--review">
  Review application
</button>
<button type="button" class="pathable-button pathable-button--low-emphasis">
  Skip for now
</button>
<button type="button" class="pathable-button pathable-button--destructive">
  Delete draft plan
</button>
