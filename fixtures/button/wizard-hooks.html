<!-- description: The back and submit position classes. They only take effect inside the actions region of a wizard; used here on their own they change nothing. -->
<button
  type="button"
  class="pathable-button pathable-button--outline pathable-button--back"
>
  Back to household details
</button>
<button type="submit" class="pathable-button pathable-button--submit">
  Submit application
</button>
