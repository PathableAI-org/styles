<!-- description: Four segments with a label under each bar, and a heading that gives the current step. The first step is complete, the second is current and the others are upcoming. The visible labels are hidden from screen readers; the hidden text in each segment names the step and whether it is completed. -->
<section class="pathable-step-indicator" aria-label="Intake progress">
  <ol class="pathable-step-indicator__segments">
    <li
      class="pathable-step-indicator__segment pathable-step-indicator__segment--complete"
    >
      <span class="pathable-sr-only">Intake, completed</span>
      <span class="pathable-step-indicator__segment-label" aria-hidden="true"
        >Intake</span
      >
    </li>
    <li
      class="pathable-step-indicator__segment pathable-step-indicator__segment--current"
      aria-current="step"
    >
      <span class="pathable-sr-only">Eligibility</span>
      <span class="pathable-step-indicator__segment-label" aria-hidden="true"
        >Eligibility</span
      >
    </li>
    <li class="pathable-step-indicator__segment">
      <span class="pathable-sr-only">Documents, not completed</span>
      <span class="pathable-step-indicator__segment-label" aria-hidden="true"
        >Documents</span
      >
    </li>
    <li class="pathable-step-indicator__segment">
      <span class="pathable-sr-only">Review, not completed</span>
      <span class="pathable-step-indicator__segment-label" aria-hidden="true"
        >Review</span
      >
    </li>
  </ol>
  <div class="pathable-step-indicator__header">
    <h2 class="pathable-step-indicator__heading">
      <span class="pathable-sr-only">Step</span>
      <span class="pathable-step-indicator__current-step">2</span>
      <span class="pathable-step-indicator__total-steps">of 4</span>
      Eligibility
    </h2>
  </div>
</section>
