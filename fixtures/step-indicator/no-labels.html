<!-- description: Bars only, with no visible labels. The list is hidden from assistive technology, so the heading must say which step the person is on and how many there are. -->
<div class="pathable-step-indicator pathable-step-indicator--no-labels">
  <ol class="pathable-step-indicator__segments" aria-hidden="true">
    <li
      class="pathable-step-indicator__segment pathable-step-indicator__segment--complete"
    >
      <span class="pathable-step-indicator__segment-label"
        >Intake <span class="pathable-sr-only">completed</span></span
      >
    </li>
    <li
      class="pathable-step-indicator__segment pathable-step-indicator__segment--current"
    >
      <span class="pathable-step-indicator__segment-label">Eligibility</span>
    </li>
    <li class="pathable-step-indicator__segment">
      <span class="pathable-step-indicator__segment-label"
        >Documents <span class="pathable-sr-only">not completed</span></span
      >
    </li>
    <li class="pathable-step-indicator__segment">
      <span class="pathable-step-indicator__segment-label"
        >Review <span class="pathable-sr-only">not completed</span></span
      >
    </li>
  </ol>
  <div class="pathable-step-indicator__header">
    <h2 class="pathable-step-indicator__heading">
      <span class="pathable-step-indicator__heading-counter">
        <span class="pathable-sr-only">Step</span>
        <span class="pathable-step-indicator__current-step">2</span>
        <span class="pathable-step-indicator__total-steps">of 4</span>
      </span>
      <span class="pathable-step-indicator__heading-text">Eligibility</span>
    </h2>
  </div>
</div>
