<!-- description: An emergency site alert with no heading, where a bold lead-in carries the short message. -->
<section
  class="pathable-site-alert pathable-site-alert--emergency pathable-site-alert--no-heading"
  aria-label="Site alert"
>
  <div class="pathable-alert">
    <div class="pathable-alert__body">
      <p class="pathable-alert__text">
        <strong>Offices closed Monday.</strong> All appointments are moved to
        phone calls until the weather clears.
        <a class="pathable-link" href="/status/closures">See closures</a>.
      </p>
    </div>
  </div>
</section>
