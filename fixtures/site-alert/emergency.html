<!-- description: An emergency site alert for an outage that affects every user. -->
<section
  class="pathable-site-alert pathable-site-alert--emergency"
  aria-label="Site alert"
>
  <div class="pathable-alert">
    <div class="pathable-alert__body">
      <h3 class="pathable-alert__heading">Appointment booking is down</h3>
      <p class="pathable-alert__text">
        Participants cannot book or change appointments right now. Call the
        intake line to schedule while we restore the service.
      </p>
    </div>
  </div>
</section>
