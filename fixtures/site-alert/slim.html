<!-- description: A slim emergency site alert with a single line of text and no heading. -->

  aria-label="Site alert"
>
  <div class="pathable-alert">
    <div class="pathable-alert__body">
      <p class="pathable-alert__text">
        <strong>Phone lines are down.</strong> Use the online chat to reach your

      </p>
    </div>
  </div>
</section>
