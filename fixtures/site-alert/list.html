<!-- description: An emergency site alert with a heading and a list of several short messages instead of one paragraph. -->
<section
  class="pathable-site-alert pathable-site-alert--emergency"
  aria-label="Site alert"
>
  <div class="pathable-alert">
    <div class="pathable-alert__body">
      <h3 class="pathable-alert__heading">Service disruptions today</h3>
      <ul class="pathable-list">
        <li>
          Appointment booking is down. Call the
          <a class="pathable-link" href="/contact/intake">intake line</a> to
          schedule.
        </li>
        <li>Document uploads are slow and may time out.</li>
        <li>Offices stay open for walk-ins until 5:00 PM.</li>
      </ul>
    </div>
  </div>
</section>
