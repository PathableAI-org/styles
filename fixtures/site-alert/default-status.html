<!-- description: A site alert with no status modifier is the info site alert. It is placed directly under the site header. It is a section named by aria-label and holds a nested alert with a heading and a message. -->
<section class="pathable-site-alert" aria-label="Site alert">
  <div class="pathable-alert">
    <div class="pathable-alert__body">
      <h3 class="pathable-alert__heading">Training portal closed on Monday</h3>
      <p class="pathable-alert__text">
        The training portal will be closed all day for a content update. Finish
        your course and read the
        <a class="pathable-link" href="/status/training">closure details</a>.
      </p>
    </div>
  </div>
</section>
