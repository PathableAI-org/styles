<!-- description: An informational site alert placed directly under the site header. It is a section named by aria-label and holds a nested alert with a heading and a message. -->
<section
  class="pathable-site-alert pathable-site-alert--info"
  aria-label="Site alert"
>
  <div class="pathable-alert">
    <div class="pathable-alert__body">
      <h3 class="pathable-alert__heading">Scheduled maintenance on Sunday</h3>
      <p class="pathable-alert__text">
        Case management will be unavailable from 11:00 PM to 1:00 AM. Save your
        work and read the
        <a class="pathable-link" href="/status/maintenance"
          >maintenance details</a
        >.
      </p>
    </div>
  </div>
</section>
