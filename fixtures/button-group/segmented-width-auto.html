<!-- description: A segmented view switch whose buttons keep the width of their labels at every viewport width, instead of filling the group below 480 px. The width class on each button wins over the group's own width. -->
<ul class="pathable-button-group pathable-button-group--segmented">
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button width-auto"
      aria-pressed="true"
    >
      List
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button pathable-button--outline width-auto"
      aria-pressed="false"
    >
      Board
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button pathable-button--outline width-auto"
      aria-pressed="false"
    >
      Calendar
    </button>
  </li>
</ul>
