<!-- description: A group on a list, with each button in a list item. The list has no markers, so it takes an explicit list role and a name. -->
<ul class="pathable-button-group" role="list" aria-label="Appointment actions">
  <li>
    <button type="button" class="pathable-button">Confirm appointment</button>
  </li>
  <li>
    <button type="button" class="pathable-button pathable-button--outline">
      Reschedule
    </button>
  </li>
</ul>
