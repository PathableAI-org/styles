<!-- description: Three actions in a group, the main action last. -->
<ul class="pathable-button-group">
  <li class="pathable-button-group__item">
    <button type="button" class="pathable-button pathable-button--outline">
      Cancel
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button type="button" class="pathable-button pathable-button--secondary">
      Save draft
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button type="submit" class="pathable-button">Submit referral</button>
  </li>
</ul>
