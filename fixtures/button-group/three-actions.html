<!-- description: Three actions, with the destructive one between the others. -->
<div class="pathable-button-group" role="group" aria-label="Referral decision">
  <button type="button" class="pathable-button pathable-button--outline">
    Cancel
  </button>
  <button type="button" class="pathable-button pathable-button--destructive">
    Delete referral
  </button>
  <button type="button" class="pathable-button">Keep referral</button>
</div>
