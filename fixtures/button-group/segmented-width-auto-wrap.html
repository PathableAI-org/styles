<!-- description: A segmented view switch whose buttons have width-auto and labels too long for one line on a phone. Below 480 px, when the labels do not fit, the buttons shrink and the labels wrap, so the strip stays inside the group. From 480 px the strip is as wide as its content. -->
<ul class="pathable-button-group pathable-button-group--segmented">
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button width-auto"
      aria-pressed="true"
    >
      List view
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button pathable-button--outline width-auto"
      aria-pressed="false"
    >
      Board view
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button pathable-button--outline width-auto"
      aria-pressed="false"
    >
      Calendar view
    </button>
  </li>
</ul>
