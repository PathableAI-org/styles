<!-- description: The segmented target: three closely related actions joined into one strip. The modifier and item classes are not in the stylesheet yet, so today the buttons render separately. -->
<ul
  class="pathable-button-group pathable-button-group--segmented"
  role="list"
  aria-label="Caseload report"
>
  <li class="pathable-button-group__item">
    <button type="button" class="pathable-button">Download PDF</button>
  </li>
  <li class="pathable-button-group__item">
    <button type="button" class="pathable-button">Export CSV</button>
  </li>
  <li class="pathable-button-group__item">
    <button type="button" class="pathable-button">Print report</button>
  </li>
</ul>
