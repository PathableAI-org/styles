<!-- description: A segmented group used as a view switch. The current view is the filled button and the alternatives are outline buttons. -->
<ul class="pathable-button-group pathable-button-group--segmented">
  <li class="pathable-button-group__item">
    <button type="button" class="pathable-button" aria-pressed="true">
      List
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button pathable-button--outline"
      aria-pressed="false"
    >
      Board
    </button>
  </li>
  <li class="pathable-button-group__item">
    <button
      type="button"
      class="pathable-button pathable-button--outline"
      aria-pressed="false"
    >
      Calendar
    </button>
  </li>
</ul>
