<!-- description: A button and a link on each surface that changes the focus ring (link, accent, base and danger), and a white panel inside the link surface that resets the ring. -->
<div class="pathable-bg-link padding-2">
  <p class="margin-0 text-white">
    Your appointment is confirmed for Tuesday at 10:30 AM.
  </p>
  <button type="button" class="pathable-button">Reschedule</button>
  <a class="pathable-link text-white" href="#surface-focus-ring-details"
    >View details</a
  >
  <div class="pathable-bg-surface padding-2">
    <p class="margin-0">Bring a photo ID to the front desk.</p>
    <button type="button" class="pathable-button">Get directions</button>
    <a class="pathable-link" href="#surface-focus-ring-directions">Parking</a>
  </div>
</div>
<div class="pathable-bg-accent padding-2">
  <p class="margin-0 text-primary-darker">Your job coach is Priya Nair.</p>
  <button type="button" class="pathable-button">Send a message</button>
  <a class="pathable-link text-primary-darker" href="#surface-focus-ring-coach"
    >View coach profile</a
  >
</div>
<div class="pathable-bg-base padding-2">
  <p class="margin-0">Intake form received on 4 March.</p>
  <button type="button" class="pathable-button">Download a copy</button>
  <a class="pathable-link" href="#surface-focus-ring-intake">View the form</a>
</div>
<div class="pathable-bg-danger padding-2">
  <p class="margin-0 text-white">Your benefits review is overdue.</p>
  <button type="button" class="pathable-button">Start review</button>
  <a class="pathable-link text-white" href="#surface-focus-ring-review"
    >Get help with the review</a
  >
</div>
