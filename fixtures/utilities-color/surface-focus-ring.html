<!-- description: A button on each background that changes the focus ring (primary-vivid, secondary, success and error), a button and a link on the base background, and a white panel inside the primary-vivid background that resets the ring. -->
<div class="bg-primary-vivid padding-2 margin-bottom-2">
  <p class="margin-0 margin-bottom-2 text-white">
    Your appointment is confirmed for Tuesday at 10:30 AM.
  </p>
  <button type="button" class="pathable-button margin-bottom-2">
    Reschedule
  </button>
  <div class="bg-white padding-2 margin-top-2">
    <p class="margin-0 margin-bottom-2">Bring a photo ID to the front desk.</p>
    <button type="button" class="pathable-button margin-bottom-2">
      Get directions
    </button>
    <a class="pathable-link" href="#surface-focus-ring-directions">Parking</a>
  </div>
</div>
<div class="bg-secondary padding-2 margin-bottom-2">
  <p class="margin-0 margin-bottom-2 text-primary-darker">
    Your job coach is Priya Nair.
  </p>
  <button type="button" class="pathable-button">Send a message</button>
</div>
<div class="bg-success padding-2 margin-bottom-2">
  <p class="margin-0 margin-bottom-2 text-primary-darker">
    Your résumé was uploaded successfully.
  </p>
  <button type="button" class="pathable-button">View résumé</button>
</div>
<div class="bg-base padding-2 margin-bottom-2">
  <p class="margin-0 margin-bottom-2">Intake form received on 4 March.</p>
  <button type="button" class="pathable-button margin-right-2 margin-bottom-2">
    Download a copy
  </button>
  <a class="pathable-link" href="#surface-focus-ring-intake">View the form</a>
</div>
<div class="bg-error padding-2">
  <p class="margin-0 margin-bottom-2 text-white">
    Your benefits review is overdue.
  </p>
  <button type="button" class="pathable-button">Start review</button>
</div>
