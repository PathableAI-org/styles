<!-- description: The default footer with a row of primary links, then a secondary section with the logo, social links and contact details. -->
<footer class="pathable-footer">
  <div class="grid-container pathable-footer__return-to-top">
    <a href="#">Return to top</a>
  </div>
  <div class="pathable-footer__primary-section">
    <nav class="pathable-footer__nav" aria-label="Footer navigation">
      <ul class="grid-row grid-gap">
        <li
          class="mobile-lg:grid-col-4 desktop:grid-col-auto pathable-footer__primary-content"
        >
          <a class="pathable-footer__primary-link" href="/pathways"
            >Learning pathways</a
          >
        </li>
        <li
          class="mobile-lg:grid-col-4 desktop:grid-col-auto pathable-footer__primary-content"
        >
          <a class="pathable-footer__primary-link" href="/jobs">Job search</a>
        </li>
        <li
          class="mobile-lg:grid-col-4 desktop:grid-col-auto pathable-footer__primary-content"
        >
          <a class="pathable-footer__primary-link" href="/accessibility"
            >Accessibility</a
          >
        </li>
        <li
          class="mobile-lg:grid-col-4 desktop:grid-col-auto pathable-footer__primary-content"
        >
          <a class="pathable-footer__primary-link" href="/help">Help centre</a>
        </li>
      </ul>
    </nav>
  </div>
  <div class="pathable-footer__secondary-section">
    <div class="grid-container">
      <div class="grid-row grid-gap">
        <div
          class="pathable-footer__logo grid-row mobile-lg:grid-col-6 mobile-lg:grid-gap-2"
        >
          <div class="mobile-lg:grid-col-auto">
            <img
              class="pathable-footer__logo-img"
              src="/assets/img/hero.jpg"
              alt=""
            />
          </div>
          <div class="mobile-lg:grid-col-auto">
            <p class="pathable-footer__logo-heading">PathAble</p>
          </div>
        </div>
        <div class="pathable-footer__contact-links mobile-lg:grid-col-6">
          <div class="pathable-footer__social-links grid-row grid-gap-1">
            <div class="grid-col-auto">
              <a
                class="pathable-social-link"
                href="https://example.com/pathable/linkedin"
              >
                <svg
                  class="pathable-social-link__icon"
                  role="img"
                  focusable="false"
                  aria-labelledby="footer-default-social-linkedin"
                >
                  <title id="footer-default-social-linkedin">LinkedIn</title>
                  <use href="/assets/img/sprite.svg#linkedin"></use>
                </svg>
              </a>
            </div>
            <div class="grid-col-auto">
              <a
                class="pathable-social-link"
                href="https://example.com/pathable/facebook"
              >
                <svg
                  class="pathable-social-link__icon"
                  role="img"
                  focusable="false"
                  aria-labelledby="footer-default-social-facebook"
                >
                  <title id="footer-default-social-facebook">Facebook</title>
                  <use href="/assets/img/sprite.svg#facebook"></use>
                </svg>
              </a>
            </div>
            <div class="grid-col-auto">
              <a
                class="pathable-social-link"
                href="https://example.com/pathable/youtube"
              >
                <svg
                  class="pathable-social-link__icon"
                  role="img"
                  focusable="false"
                  aria-labelledby="footer-default-social-youtube"
                >
                  <title id="footer-default-social-youtube">YouTube</title>
                  <use href="/assets/img/sprite.svg#youtube"></use>
                </svg>
              </a>
            </div>
            <div class="grid-col-auto">
              <a
                class="pathable-social-link"
                href="https://example.com/pathable/instagram"
              >
                <svg
                  class="pathable-social-link__icon"
                  role="img"
                  focusable="false"
                  aria-labelledby="footer-default-social-instagram"
                >
                  <title id="footer-default-social-instagram">Instagram</title>
                  <use href="/assets/img/sprite.svg#instagram"></use>
                </svg>
              </a>
            </div>
            <div class="grid-col-auto">
              <a
                class="pathable-social-link"
                href="https://example.com/pathable/rss"
              >
                <svg
                  class="pathable-social-link__icon"
                  role="img"
                  focusable="false"
                  aria-labelledby="footer-default-social-rss"
                >
                  <title id="footer-default-social-rss">RSS</title>
                  <use href="/assets/img/sprite.svg#rss_feed"></use>
                </svg>
              </a>
            </div>
          </div>
          <p class="pathable-footer__contact-heading">PathAble Support</p>
          <address class="pathable-footer__address">
            <div class="pathable-footer__contact-info grid-row grid-gap">
              <div class="grid-col-auto">
                <a href="tel:+18005550142">(800)&nbsp;555&#8209;0142</a>
              </div>
              <div class="grid-col-auto">
                <a href="mailto:support@pathable.example"
                  >support@pathable.example</a
                >
              </div>
            </div>
          </address>
        </div>
      </div>
    </div>
  </div>
</footer>
