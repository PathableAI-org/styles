<!-- description: Checked choices. The native checked attribute draws the filled box and the check mark. -->
<fieldset class="pathable-fieldset">
  <legend class="pathable-legend">Which supports were arranged?</legend>
  <div class="pathable-checkbox">
    <input
      class="pathable-checkbox__input"
      id="checkbox-checked-transportation"
      type="checkbox"
      name="arranged-supports"
      value="transportation"
      checked
    />
    <label
      class="pathable-checkbox__label"
      for="checkbox-checked-transportation"
      >Transportation assistance</label
    >
  </div>
  <div class="pathable-checkbox">
    <input
      class="pathable-checkbox__input"
      id="checkbox-checked-child-care"
      type="checkbox"
      name="arranged-supports"
      value="child-care"
      checked
    />
    <label class="pathable-checkbox__label" for="checkbox-checked-child-care"
      >Child care</label
    >
  </div>
  <div class="pathable-checkbox">
    <input
      class="pathable-checkbox__input"
      id="checkbox-checked-interview-clothing"
      type="checkbox"
      name="arranged-supports"
      value="interview-clothing"
    />
    <label
      class="pathable-checkbox__label"
      for="checkbox-checked-interview-clothing"
      >Interview clothing</label
    >
  </div>
</fieldset>
