<!-- description: A group of related choices in a fieldset with a legend. Each choice is a root, a native checkbox and a label; one choice carries a description. -->
<fieldset class="pathable-fieldset">
  <legend class="pathable-legend">
    Which supports does the participant need?
  </legend>
  <div class="pathable-checkbox">
    <input
      class="pathable-checkbox__input"
      id="checkbox-default-transportation"
      type="checkbox"
      name="supports[]"
      value="transportation"
    />
    <label
      class="pathable-checkbox__label"
      for="checkbox-default-transportation"
      >Transportation assistance</label
    >
  </div>
  <div class="pathable-checkbox">
    <input
      class="pathable-checkbox__input"
      id="checkbox-default-child-care"
      type="checkbox"
      name="supports[]"
      value="child-care"
    />
    <label class="pathable-checkbox__label" for="checkbox-default-child-care">
      Child care
      <span class="pathable-checkbox__label-description"
        >Covers care during appointments and training hours.</span
      >
    </label>
  </div>
  <div class="pathable-checkbox">
    <input
      class="pathable-checkbox__input"
      id="checkbox-default-interview-clothing"
      type="checkbox"
      name="supports[]"
      value="interview-clothing"
    />
    <label
      class="pathable-checkbox__label"
      for="checkbox-default-interview-clothing"
      >Interview clothing</label
    >
  </div>
</fieldset>
