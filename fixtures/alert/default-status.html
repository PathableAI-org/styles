<!-- description: An alert with no status modifier is the info alert: it shows the same informational status as one that carries `pathable-alert--info`. It is static and present when the page loads. It is a static named region: a `<section>` with an aria-label is a region landmark with a name, and the heading opens with the alert type. -->
<section class="pathable-alert" aria-label="Benefits enrollment">
  <div class="pathable-alert__body">
    <h3 class="pathable-alert__heading">
      Information: enrollment window extended
    </h3>
    <p class="pathable-alert__text">
      The benefits enrollment window for current participants now closes on
      Friday. Review the
      <a class="pathable-link" href="/enrollment/dates">enrollment dates</a>
      before you submit your choices.
    </p>
  </div>
</section>
