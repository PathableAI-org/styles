<!-- description: An emergency alert for urgent, service-affecting news, announced at once with role="alert". -->
<div class="pathable-alert pathable-alert--emergency" role="alert">
  <div class="pathable-alert__body">
    <h3 class="pathable-alert__heading">
      Emergency: intake office closed today
    </h3>
    <p class="pathable-alert__text">
      The downtown office is closed because of a power outage. All in-person
      appointments today are moved to phone calls.
      <a class="pathable-link" href="/appointments">Check your appointment</a>
      for the new call time.
    </p>
  </div>
</div>
