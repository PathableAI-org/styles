<!-- description: An informational alert on a dark container. It keeps its own pale surface, dark blue text and link colour. -->
<div class="pathable-dark-background padding-2">
  <section
    class="pathable-alert pathable-alert--info"
    aria-label="Resume workshop"
  >
    <div class="pathable-alert__body">
      <h3 class="pathable-alert__heading">
        Information: resume workshop is open
      </h3>
      <p class="pathable-alert__text">
        Seats remain in the Tuesday resume workshop at the career center. Read
        the
        <a class="pathable-link" href="/workshops/resume">workshop details</a>
        before you register.
      </p>
    </div>
  </section>
</div>
