<!-- description: An error alert for a failed action. role="alert" is an urgent announcement: a screen reader interrupts to read it, so use it only for a message the reader must hear now. -->
<div class="pathable-alert pathable-alert--error" role="alert">
  <div class="pathable-alert__body">
    <h3 class="pathable-alert__heading">
      Error: appointment could not be booked
    </h3>
    <p class="pathable-alert__text">
      The 2:00 PM slot with Priya Natarajan was taken while you were editing.
      Choose another time and try again.
    </p>
  </div>
</div>
