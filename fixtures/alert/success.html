<!-- description: A success alert that the application adds after an action. role="status" is an advisory announcement: a screen reader reads it when it is next idle. -->
<div class="pathable-alert pathable-alert--success" role="status">
  <div class="pathable-alert__body">
    <h3 class="pathable-alert__heading">Success: employment plan saved</h3>
    <p class="pathable-alert__text">
      Marcus Johnson's employment plan was updated and sent to his case worker
      for review.
    </p>
  </div>
</div>
