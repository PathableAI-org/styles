<!-- description: An informational alert on the page when it loads. It is a static named region: role="region" and an aria-label give it a name, and the heading opens with the alert type. -->
<div
  class="pathable-alert pathable-alert--info"
  role="region"
  aria-label="Orientation schedule"
>
  <div class="pathable-alert__body">
    <h3 class="pathable-alert__heading">
      Information: orientation moved to Thursday
    </h3>
    <p class="pathable-alert__text">
      The employment readiness orientation for new participants now starts at
      10:00 AM. Review the
      <a class="pathable-link" href="/orientation/schedule">updated schedule</a>
      before you confirm attendance.
    </p>
  </div>
</div>
