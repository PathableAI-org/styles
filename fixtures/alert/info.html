<!-- description: An informational alert with a heading and a message that includes a link. It sets no role, because it is on the page when it loads. -->
<div class="pathable-alert pathable-alert--info">
  <div class="pathable-alert__body">
    <h3 class="pathable-alert__heading">Orientation moved to Thursday</h3>
    <p class="pathable-alert__text">
      The employment readiness orientation for new participants now starts at
      10:00 AM. Review the
      <a class="pathable-link" href="/orientation/schedule">updated schedule</a>
      before you confirm attendance.
    </p>
  </div>
</div>
