<!-- description: A warning alert with only a message. The heading is optional; leaving it out needs no modifier class, and the alert type opens the message in bold. -->
<div class="pathable-alert pathable-alert--warning">
  <div class="pathable-alert__body">
    <p class="pathable-alert__text">
      <strong>Warning:</strong> participant documents older than 90 days must be
      uploaded again before the eligibility review.
    </p>
  </div>
</div>
