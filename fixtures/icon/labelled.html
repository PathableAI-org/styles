<!-- description: An icon that carries meaning on its own. Its accessible name comes from a title inside the SVG, which aria-labelledby points at. -->
<p>
  <svg
    class="pathable-icon"
    focusable="false"
    role="img"
    aria-labelledby="icon-labelled-overdue-title"
  >
    <title id="icon-labelled-overdue-title">Overdue</title>
    <use href="/assets/img/sprite.svg#warning"></use>
  </svg>
</p>
