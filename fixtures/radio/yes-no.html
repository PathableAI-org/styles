<!-- description: A yes or no question as two radios in a fieldset with a legend that asks the question. -->
<fieldset class="pathable-fieldset">
  <legend class="pathable-legend">
    Does the participant need transportation assistance?
  </legend>
  <div class="pathable-radio">
    <input
      class="pathable-radio__input"
      id="radio-yes-no-yes"
      type="radio"
      name="radio-yes-no-transportation"
      value="yes"
    />
    <label class="pathable-radio__label" for="radio-yes-no-yes">Yes</label>
  </div>
  <div class="pathable-radio">
    <input
      class="pathable-radio__input"
      id="radio-yes-no-no"
      type="radio"
      name="radio-yes-no-transportation"
      value="no"
    />
    <label class="pathable-radio__label" for="radio-yes-no-no">No</label>
  </div>
</fieldset>
