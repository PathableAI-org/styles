<!-- description: A group with one choice selected. The native checked attribute draws the filled ring. -->
<fieldset class="pathable-fieldset">
  <legend class="pathable-legend">
    What is the participant's employment goal?
  </legend>
  <div class="pathable-radio">
    <input
      class="pathable-radio__input"
      id="radio-checked-job-search"
      type="radio"
      name="radio-checked-goal"
      value="job-search"
      checked
    />
    <label class="pathable-radio__label" for="radio-checked-job-search"
      >Job search skills</label
    >
  </div>
  <div class="pathable-radio">
    <input
      class="pathable-radio__input"
      id="radio-checked-training"
      type="radio"
      name="radio-checked-goal"
      value="training"
    />
    <label class="pathable-radio__label" for="radio-checked-training"
      >Vocational training</label
    >
  </div>
  <div class="pathable-radio">
    <input
      class="pathable-radio__input"
      id="radio-checked-education"
      type="radio"
      name="radio-checked-goal"
      value="education"
    />
    <label class="pathable-radio__label" for="radio-checked-education"
      >Return to school</label
    >
  </div>
</fieldset>
