<!-- description: The middle of a long range: the first page, the pages either side of the current page 10 and the last page, with overflow marks where pages are left out, and previous and next links. -->
<nav aria-label="Participant list pages" class="pathable-pagination">
  <ul class="pathable-pagination__list">
    <li class="pathable-pagination__item pathable-pagination__arrow">
      <a
        href="/participants?page=9"
        class="pathable-pagination__link pathable-pagination__previous-page"
        aria-label="Previous page"
      >
        <svg
          class="pathable-icon"
          aria-hidden="true"
          focusable="false"
          role="img"
        >
          <use href="/assets/img/sprite.svg#navigate_before"></use>
        </svg>
        <span class="pathable-pagination__link-text">Previous</span>
      </a>
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=1"
        class="pathable-pagination__button"
        aria-label="Page 1"
        >1</a
      >
    </li>
    <li
      class="pathable-pagination__item pathable-pagination__overflow"
      aria-label="ellipsis indicating non-visible pages"
    >
      <span>…</span>
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=9"
        class="pathable-pagination__button"
        aria-label="Page 9"
        >9</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=10"
        class="pathable-pagination__button pathable-current"
        aria-label="Page 10"
        aria-current="page"
        >10</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=11"
        class="pathable-pagination__button"
        aria-label="Page 11"
        >11</a
      >
    </li>
    <li
      class="pathable-pagination__item pathable-pagination__overflow"
      aria-label="ellipsis indicating non-visible pages"
    >
      <span>…</span>
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=24"
        class="pathable-pagination__button"
        aria-label="Last page, page 24"
        >24</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__arrow">
      <a
        href="/participants?page=11"
        class="pathable-pagination__link pathable-pagination__next-page"
        aria-label="Next page"
      >
        <span class="pathable-pagination__link-text">Next</span>
        <svg
          class="pathable-icon"
          aria-hidden="true"
          focusable="false"
          role="img"
        >
          <use href="/assets/img/sprite.svg#navigate_next"></use>
        </svg>
      </a>
    </li>
  </ul>
</nav>
