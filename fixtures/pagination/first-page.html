<!-- description: The first page of eight: no previous link, and the current page is marked. -->
<nav aria-label="Participant list pages" class="pathable-pagination">
  <ul class="pathable-pagination__list">
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=1"
        class="pathable-pagination__button pathable-current"
        aria-label="Page 1"
        aria-current="page"
        >1</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=2"
        class="pathable-pagination__button"
        aria-label="Page 2"
        >2</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=3"
        class="pathable-pagination__button"
        aria-label="Page 3"
        >3</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=4"
        class="pathable-pagination__button"
        aria-label="Page 4"
        >4</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=5"
        class="pathable-pagination__button"
        aria-label="Page 5"
        >5</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__overflow">
      <span aria-hidden="true">…</span>
      <span class="pathable-sr-only"
        >ellipsis indicating non-visible pages</span
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__page-no">
      <a
        href="/participants?page=8"
        class="pathable-pagination__button"
        aria-label="Last page, page 8"
        >8</a
      >
    </li>
    <li class="pathable-pagination__item pathable-pagination__arrow">
      <a
        href="/participants?page=2"
        class="pathable-pagination__link pathable-pagination__next-page"
        aria-label="Next page"
      >
        <span class="pathable-pagination__link-text">Next</span>
        <svg
          class="pathable-icon"
          aria-hidden="true"
          focusable="false"
          role="img"
        >
          <use href="/assets/img/sprite.svg#navigate_next"></use>
        </svg>
      </a>
    </li>
  </ul>
</nav>
