<!-- description: Named spacing tokens used as widths: card is 160 px, card-lg is 240 px and mobile is 320 px, capped at the width of the container. -->
<ul class="add-list-reset" role="list" aria-label="Named width tokens">
  <li class="margin-bottom-1">
    <div class="bg-accent-cool-light text-ink padding-1 width-card maxw-full">
      width-card: 10rem
    </div>
  </li>
  <li class="margin-bottom-1">
    <div
      class="bg-accent-cool-light text-ink padding-1 width-card-lg maxw-full"
    >
      width-card-lg: 15rem
    </div>
  </li>
  <li class="margin-bottom-1">
    <div class="bg-accent-cool-light text-ink padding-1 width-mobile maxw-full">
      width-mobile: 20rem
    </div>
  </li>
</ul>
