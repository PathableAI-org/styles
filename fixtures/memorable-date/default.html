<!-- description: A memorable date with a month select and day and year text inputs. The hint is linked to every control. -->
<fieldset class="pathable-fieldset">
  <legend class="pathable-legend">Program start date</legend>
  <span class="pathable-hint" id="memorable-date-default-hint"
    >For example: January 19 2026</span
  >
  <div class="pathable-memorable-date">
    <div
      class="pathable-form-group pathable-form-group--month pathable-form-group--select"
    >
      <label class="pathable-label" for="memorable-date-default-month"
        >Month</label
      >
      <select
        class="pathable-select"
        id="memorable-date-default-month"
        name="start_date_month"
        aria-describedby="memorable-date-default-hint"
      >
        <option value>- Select -</option>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
    </div>
    <div class="pathable-form-group pathable-form-group--day">
      <label class="pathable-label" for="memorable-date-default-day">Day</label>
      <input
        class="pathable-input"
        aria-describedby="memorable-date-default-hint"
        id="memorable-date-default-day"
        name="start_date_day"
        maxlength="2"
        pattern="[0-9]*"
        inputmode="numeric"
        value=""
      />
    </div>
    <div class="pathable-form-group pathable-form-group--year">
      <label class="pathable-label" for="memorable-date-default-year"
        >Year</label
      >
      <input
        class="pathable-input"
        aria-describedby="memorable-date-default-hint"
        id="memorable-date-default-year"
        name="start_date_year"
        minlength="4"
        maxlength="4"
        pattern="[0-9]*"
        inputmode="numeric"
        value=""
      />
    </div>
  </div>
</fieldset>
