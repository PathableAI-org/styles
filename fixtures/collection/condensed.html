<!-- description: The condensed modifier, for a list of headings with one line of details each. The condensed class is not in the stylesheet yet. -->
<ul
  class="pathable-collection pathable-collection--condensed"
  role="list"
  aria-label="Recent updates"
>
  <li class="pathable-collection__item">
    <div class="pathable-collection__body">
      <h3 class="pathable-collection__heading">
        <a class="pathable-link" href="/updates/new-intake-form"
          >A shorter intake form for new participants</a
        >
      </h3>
      <ul
        class="pathable-collection__meta"
        role="list"
        aria-label="Details for new intake form"
      >
        <li class="pathable-collection__meta-item">Programme news</li>
      </ul>
    </div>
  </li>
  <li class="pathable-collection__item">
    <div class="pathable-collection__body">
      <h3 class="pathable-collection__heading">
        <a class="pathable-link" href="/updates/office-hours"
          >Winter office hours for case workers</a
        >
      </h3>
      <ul
        class="pathable-collection__meta"
        role="list"
        aria-label="Details for office hours"
      >
        <li class="pathable-collection__meta-item">Staff notice</li>
      </ul>
    </div>
  </li>
</ul>
