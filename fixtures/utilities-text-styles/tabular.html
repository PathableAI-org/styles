<!-- description: A table of weekly hours where text-tabular gives every digit the same width, so the figures line up in a column. -->
<table>
  <caption>
    Hours logged this week
  </caption>
  <thead>
    <tr>
      <th scope="col">Day</th>
      <th scope="col">Hours</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">Monday</th>
      <td class="text-tabular">7.25</td>
    </tr>
    <tr>
      <th scope="row">Tuesday</th>
      <td class="text-tabular">6.50</td>
    </tr>
    <tr>
      <th scope="row">Wednesday</th>
      <td class="text-tabular">11.75</td>
    </tr>
  </tbody>
</table>
