<!-- description: A short checklist where each item starts with a status icon. The meaning is in the text, so the icons are hidden from assistive technology. -->
<ul class="pathable-icon-list" role="list" aria-label="Intake checklist">
  <li class="pathable-icon-list__item">
    <div class="pathable-icon-list__icon">
      <svg class="pathable-icon" aria-hidden="true" role="img">
        <use href="/assets/img/sprite.svg#check_circle"></use>
      </svg>
    </div>
    <div class="pathable-icon-list__content">Photo identification verified</div>
  </li>
  <li class="pathable-icon-list__item">
    <div class="pathable-icon-list__icon">
      <svg class="pathable-icon" aria-hidden="true" role="img">
        <use href="/assets/img/sprite.svg#check_circle"></use>
      </svg>
    </div>
    <div class="pathable-icon-list__content">Income documents uploaded</div>
  </li>
  <li class="pathable-icon-list__item">
    <div class="pathable-icon-list__icon">
      <svg class="pathable-icon" aria-hidden="true" role="img">
        <use href="/assets/img/sprite.svg#cancel"></use>
      </svg>
    </div>
    <div class="pathable-icon-list__content">Proof of address not provided</div>
  </li>
</ul>
