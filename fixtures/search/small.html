<!-- description: The small search: a compact field joined to an icon-only button whose name is hidden text, for a toolbar or header. -->
<section aria-label="Small participant search">
  <form class="pathable-search pathable-search--small" role="search">
    <label class="pathable-sr-only" for="search-small-query"
      >Search participants</label
    >
    <input
      class="pathable-input"
      id="search-small-query"
      type="search"
      name="search"
    />
    <button class="pathable-button" type="submit">
      <svg
        class="pathable-icon pathable-search__submit-icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="/assets/img/sprite.svg#search"></use>
      </svg>
      <span class="pathable-sr-only">Search</span>
    </button>
  </form>
</section>
