<!-- description: The big search: a taller field and button with larger text, for a prominent search at the top of a page. -->
<section aria-label="Big participant search">
  <form class="pathable-search pathable-search--big" role="search">
    <label class="pathable-sr-only" for="search-big-query"
      >Search participants</label
    >
    <input
      class="pathable-input"
      id="search-big-query"
      type="search"
      name="search"
    />
    <button class="pathable-button" type="submit">
      <span class="pathable-search__submit-text">Search</span>
      <svg
        class="pathable-icon pathable-search__submit-icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="/assets/img/sprite.svg#search"></use>
      </svg>
    </button>
  </form>
</section>
