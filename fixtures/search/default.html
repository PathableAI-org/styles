<!-- description: The default search: a field joined to a button that shows the word Search, or a search icon below 480 px, for a search box inside a page or a panel. -->
<section aria-label="Participant search">
  <form class="pathable-search" role="search">
    <label class="pathable-sr-only" for="search-default-query"
      >Search participants</label
    >
    <input
      class="pathable-input"
      id="search-default-query"
      type="search"
      name="search"
    />
    <button class="pathable-button" type="submit">
      <span class="pathable-search__submit-text">Search</span>
      <svg
        class="pathable-icon pathable-search__submit-icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="/assets/img/sprite.svg#search"></use>
      </svg>
    </button>
  </form>
</section>
