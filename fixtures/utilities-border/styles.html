<!-- description: Solid, dashed and dotted borders, with the width and colour set by their own classes. -->
<p
  class="border-2px border-solid border-primary text-primary margin-0 padding-2"
>
  Documents received (border-solid)
</p>
<p
  class="border-2px border-dashed border-primary text-primary margin-0 padding-2"
>
  Documents still needed (border-dashed)
</p>
<p
  class="border-2px border-dotted border-primary text-primary margin-0 padding-2"
>
  Documents on request (border-dotted)
</p>
