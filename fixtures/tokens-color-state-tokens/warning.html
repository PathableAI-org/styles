<!-- description: The warning family. The base and dark grades are amber, which needs dark text. -->
<ul class="add-list-reset" role="list" aria-label="Warning state colours">
  <li class="bg-warning-lighter text-ink padding-2 margin-bottom-1">
    <code>bg-warning-lighter</code> #fef6e9
  </li>
  <li class="bg-warning-light text-ink padding-2 margin-bottom-1">
    <code>bg-warning-light</code> #fee685
  </li>
  <li class="bg-warning text-black padding-2 margin-bottom-1">
    <code>bg-warning</code> #f5a623
  </li>
  <li class="bg-warning-dark text-black padding-2 margin-bottom-1">
    <code>bg-warning-dark</code> #c4851c
  </li>
  <li class="bg-warning-darker text-white padding-2 margin-bottom-1">
    <code>bg-warning-darker</code> #936f38
  </li>
</ul>
