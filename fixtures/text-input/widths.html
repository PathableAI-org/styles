<!-- description: Width modifiers sized to the expected value, from 2xs for a short code to 2xl for a long one. -->
<label class="pathable-label" for="text-input-widths-2xs">Grade</label>
<input
  class="pathable-input pathable-input--2xs"
  id="text-input-widths-2xs"
  name="grade"
  type="text"
/>
<label class="pathable-label" for="text-input-widths-xs">ZIP code</label>
<input
  class="pathable-input pathable-input--xs"
  id="text-input-widths-xs"
  name="zip"
  type="text"
/>
<label class="pathable-label" for="text-input-widths-sm">Date of birth</label>
<input
  class="pathable-input pathable-input--sm"
  id="text-input-widths-sm"

  type="text"
/>
<label class="pathable-label" for="text-input-widths-md">Phone number</label>
<input
  class="pathable-input pathable-input--md"

  name="phone"
  type="tel"
/>
<label class="pathable-label" for="text-input-widths-lg">Case worker</label>
<input
  class="pathable-input pathable-input--lg"

/>
<label class="pathable-label" for="text-input-widths-xl">Employer</label>
<input
  class="pathable-input pathable-input--xl"

  type="text"
/>
<label class="pathable-label" for="text-input-widths-2xl">
  Training program
</label>
<input
  class="pathable-input pathable-input--2xl"
