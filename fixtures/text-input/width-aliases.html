<!-- description: The small and medium width modifiers, which are aliases of sm and md. -->
<label class="pathable-label" for="text-input-width-aliases-small">
  Date of birth
</label>
<input
  class="pathable-input pathable-input--small"
  id="text-input-width-aliases-small"
  name="birthDate"
  type="text"
/>
<label class="pathable-label" for="text-input-width-aliases-medium">
  Phone number
</label>
<input
  class="pathable-input pathable-input--medium"
  id="text-input-width-aliases-medium"
  name="phone"
  type="tel"
/>
