<!-- description: A text input with a hint that the control references, so screen readers announce it with the label. -->
<label class="pathable-label" for="text-input-with-hint-case-number">
  Case number
</label>
<span class="pathable-hint" id="text-input-with-hint-case-number-hint">
  Find it at the top of the intake summary, for example CW-20418.
</span>
<input
  class="pathable-input"
  id="text-input-with-hint-case-number"
  name="caseNumber"
  type="text"
  aria-describedby="text-input-with-hint-case-number-hint"
/>
