<!-- description: A text input whose value has passed validation. The border is the only visual cue, so give the field a visible confirmation in text where it matters. -->
<div class="pathable-form-group">
  <label class="pathable-label" for="text-input-success-email">
    Participant email address
  </label>
  <input
    class="pathable-input pathable-input--success"
    id="text-input-success-email"
    name="email"
    type="email"
    value="amara.okafor@example.org"
  />
</div>
