<!-- description: A text input whose value has passed validation. The success border is paired with a visible confirmation in text, which the input references with aria-describedby. -->
<label class="pathable-label" for="text-input-success-email">
  Participant email address
</label>
<span class="pathable-hint" id="text-input-success-email-message">
  The email address is valid.
</span>
<input
  class="pathable-input pathable-input--success"
  id="text-input-success-email"
  name="email"
  type="email"
  value="amara.okafor@example.org"
  aria-describedby="text-input-success-email-message"
/>
