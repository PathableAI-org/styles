<!-- description: A summary box with a heading and a short list of key facts, some of them links. The box is a named region. -->
<section
  class="pathable-summary-box"
  aria-labelledby="summary-box-default-heading"
>
  <h3 class="pathable-summary-box__heading" id="summary-box-default-heading">
    Before the intake appointment
  </h3>
  <div class="pathable-summary-box__text">
    <ul class="pathable-list">
      <li>
        Bring photo identification and your most recent
        <a class="pathable-summary-box__link" href="/documents/benefits-letter"
          >benefits letter</a
        >.
      </li>
      <li>
        Your case worker will review your
        <a class="pathable-summary-box__link" href="/plans/employment"
          >employment plan</a
        >
        with you.
      </li>
      <li>
        To change the time, call the office at least one day ahead or
        <a class="pathable-summary-box__link" href="/appointments/reschedule"
          >reschedule online</a
        >.
      </li>
    </ul>
  </div>
</section>
