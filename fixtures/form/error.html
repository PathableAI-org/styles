<!-- description: A form after a failed submission. Only the question with the error carries the error modifiers, not the form. The page title also reports the error, for example "Error: Book appointment". -->
<form class="pathable-form" action="/appointments" method="post">
  <p>
    Required fields are marked with an asterisk (<abbr
      title="required"
      class="pathable-hint pathable-hint--required"
      >*</abbr
    >).
  </p>
  <label class="pathable-label" for="form-error-participant">
    Participant name
    <abbr title="required" class="pathable-hint pathable-hint--required"
      >*</abbr
    >
  </label>
  <input
    class="pathable-input"
    id="form-error-participant"
    name="participant"
    type="text"
    required
  />
  <div class="pathable-form-group pathable-form-group--error">
    <label class="pathable-label pathable-label--error" for="form-error-date">
      Appointment date
      <abbr title="required" class="pathable-hint pathable-hint--required"
        >*</abbr
      >
    </label>
    <span
      class="pathable-error-message"
      id="form-error-date-error"
      role="alert"
    >
      Enter a date in the future.
    </span>
    <input
      class="pathable-input pathable-input--error"
      id="form-error-date"
      name="date"
      type="text"
      required
      aria-describedby="form-error-date-error"
    />
  </div>
  <button type="submit" class="pathable-button">Book appointment</button>
</form>
