<!-- description: A flag card whose image sits inside the card padding with the inset modifier. The image column is 15rem wide and the image keeps 1.5rem of space around it and from the text. -->
<ul class="pathable-card-group" role="list" aria-label="Workshops">
  <li class="pathable-card pathable-card--flag">
    <div class="pathable-card__container">
      <div class="pathable-card__header">
        <h3 class="pathable-card__heading">Digital skills workshop</h3>
      </div>
      <div class="pathable-card__media pathable-card__media--inset">
        <div class="pathable-card__img">
          <img src="/assets/img/hero.jpg" alt="" />
        </div>
      </div>
      <div class="pathable-card__body">
        <p>
          Build confidence with email, video calls and online forms in small
          groups led by a tutor.
        </p>
      </div>
      <div class="pathable-card__footer">
        <a class="pathable-button" href="/services/digital-skills"
          >Learn more<span class="pathable-sr-only">
            about the digital skills workshop</span
          ></a
        >
      </div>
    </div>
  </li>
</ul>
