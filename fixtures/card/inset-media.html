<!-- description: The target for an image inset from the card edge, inside a padded media box with rounded corners. The pathable-card__media--inset and pathable-card__img classes are not in the stylesheet yet. -->

    <div class="pathable-card__header">
      <h3 class="pathable-card__heading">Digital skills class</h3>

      <div class="pathable-card__img">
