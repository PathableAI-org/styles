<!-- description: The exdent modifiers on the header, body and footer extend each part over the container border to the card edge. -->
<ul class="pathable-card-group">
  <li class="pathable-card">
    <div class="pathable-card__container">
      <div class="pathable-card__header pathable-card__header--exdent">
        <h3 class="pathable-card__heading">Quarterly progress summary</h3>
      </div>
      <div class="pathable-card__body pathable-card__body--exdent">
        <p>
          Your coach has summarised your goals, attendance and next steps for
          the quarter.
        </p>
      </div>
      <div class="pathable-card__footer pathable-card__footer--exdent">
        <a class="pathable-button" href="/summaries/quarterly"
          >Read summary<span class="pathable-sr-only"> for the quarter</span></a
        >
      </div>
    </div>
  </li>
</ul>
