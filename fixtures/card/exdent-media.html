<!-- description: The exdent media modifier pulls the image over the container border so it meets the outer edge of the card. -->
<div class="pathable-card">
  <div class="pathable-card__container">
    <div class="pathable-card__header">
      <h3 class="pathable-card__heading">Career fair this Thursday</h3>
    </div>
    <div class="pathable-card__media pathable-card__media--exdent">
      <img src="/assets/img/hero.jpg" alt="" />
    </div>
    <div class="pathable-card__body">
      <p>
        More than 30 local employers are hiring. Bring copies of your résumé and
        your employment plan.
      </p>
    </div>
    <div class="pathable-card__footer">
      <a class="pathable-button" href="/events/career-fair"
        >See details<span class="pathable-sr-only"> for career fair</span></a
      >
    </div>
  </div>
</div>
