<!-- description: The flag modifier puts the image in a column beside the text from a 40em viewport when the card is at least 30rem wide, and stacks it like a media card otherwise. -->
<ul class="pathable-card-group" role="list" aria-label="Services">
  <li class="pathable-card pathable-card--flag">
    <div class="pathable-card__container">
      <div class="pathable-card__header">
        <h3 class="pathable-card__heading">Supported employment services</h3>
      </div>
      <div class="pathable-card__media">
        <div class="pathable-card__img">
          <img src="/assets/img/hero.jpg" alt="" />
        </div>
      </div>
      <div class="pathable-card__body">
        <p>
          One-to-one coaching to help you find, start and keep a job that fits
          your skills and your schedule.
        </p>
      </div>
      <div class="pathable-card__footer">
        <a class="pathable-button" href="/services/supported-employment"
          >Learn more<span class="pathable-sr-only">
            about supported employment services</span
          ></a
        >
      </div>
    </div>
  </li>
</ul>
