<!-- description: The header-first modifier keeps the heading above the image instead of letting the image lead the card. -->
<ul class="pathable-card-group" role="list" aria-label="Plan reviews">
  <li class="pathable-card pathable-card--header-first">
    <div class="pathable-card__container">
      <div class="pathable-card__header">
        <h3 class="pathable-card__heading">Employment plan review</h3>
      </div>
      <div class="pathable-card__media">
        <div class="pathable-card__img">
          <img src="/assets/img/hero.jpg" alt="" />
        </div>
      </div>
      <div class="pathable-card__body">
        <p>
          Review the steps in your employment plan with your case worker and
          agree what to change before the next quarter.
        </p>
      </div>
      <div class="pathable-card__footer">
        <a class="pathable-button" href="/plans/review"
          >Start review<span class="pathable-sr-only">
            of employment plan</span
          ></a
        >
      </div>
    </div>
  </li>
</ul>
