<!-- description: A flag card in a group narrower than 30rem stacks like a media card, even from a 40em viewport, because the card has no room for the image column beside the text. -->
<ul class="pathable-card-group maxw-mobile">
  <li class="pathable-card pathable-card--flag">
    <div class="pathable-card__container">
      <div class="pathable-card__header">
        <h3 class="pathable-card__heading">Peer support groups</h3>
      </div>
      <div class="pathable-card__media">
        <div class="pathable-card__img">
          <img src="/assets/img/hero.jpg" alt="" />
        </div>
      </div>
      <div class="pathable-card__body">
        <p>
          Meet others on the same path, share what works and keep each other
          going.
        </p>
      </div>
      <div class="pathable-card__footer">
        <a class="pathable-button" href="/services/peer-support"
          >Learn more<span class="pathable-sr-only">
            about peer support groups</span
          ></a
        >
      </div>
    </div>
  </li>
</ul>
