<!-- description: A card with a heading, a short body and one footer action. The card is a plain block; the bordered box is the container inside it. -->
<div class="pathable-card">
  <div class="pathable-card__container">
    <div class="pathable-card__header">
      <h3 class="pathable-card__heading">Intake appointment</h3>
    </div>
    <div class="pathable-card__body">
      <p>
        Meet your case worker to review your goals, documents and the supports
        you may qualify for. Allow about 45 minutes.
      </p>
    </div>
    <div class="pathable-card__footer">
      <a class="pathable-button" href="/appointments/intake"
        >Book<span class="pathable-sr-only"> intake appointment</span></a
      >
    </div>
  </div>
</div>
