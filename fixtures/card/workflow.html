<!-- description: The workflow modifier for a card that shows a work item: a status, a short summary, a line of metadata and an action link. -->
<div class="pathable-card pathable-card--workflow">
  <div class="pathable-card__container">
    <div class="pathable-card__header">
      <h3 class="pathable-card__heading">
        Employment progress report: K. Smith
      </h3>
      <span class="pathable-card__status"
        ><span aria-hidden="true">●</span> Completed</span
      >
    </div>
    <div class="pathable-card__body">
      <p>
        All six employment goal milestones were met this period. The next review
        is scheduled for next month.
      </p>
      <p class="pathable-card__meta">Generated Jul 8, 2026 | Period Q2 2026</p>
      <a class="pathable-card__action" href="/reports/progress-q2"
        >Download full report</a
      >
    </div>
  </div>
</div>
