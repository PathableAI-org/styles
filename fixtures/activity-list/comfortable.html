<!-- description: The comfortable density modifier, for lists with room to spare. -->
<ul
  class="pathable-activity-list pathable-activity-list--comfortable pathable-margin-0 pathable-padding-0"
  role="list"
  aria-label="Upcoming work"
>
  <li class="pathable-activity-row">
    <span
      class="pathable-activity-row__status"
      data-status="completed"
      aria-hidden="true"
    ></span>
    <span class="pathable-activity-row__status-text">Completed</span>
    <div class="pathable-activity-row__body">
      <p class="pathable-activity-row__title">Placement confirmed</p>
      <p class="pathable-activity-row__context">Participant: Sarah Mitchell</p>
    </div>
    <span class="pathable-activity-row__date">Mar 15</span>
    <span class="pathable-activity-row__owner">
      <span class="pathable-activity-row__owner-text">You</span>
    </span>
    <div class="pathable-activity-row__actions">
      <button type="button" class="pathable-button pathable-button--outline">
        View<span class="pathable-sr-only"> Placement confirmed</span>
      </button>
    </div>
  </li>
  <li class="pathable-activity-row">
    <span
      class="pathable-activity-row__status"
      data-status="in-progress"
      aria-hidden="true"
    ></span>
    <span class="pathable-activity-row__status-text">In progress</span>
    <div class="pathable-activity-row__body">
      <p class="pathable-activity-row__title">Job interview preparation</p>
      <p class="pathable-activity-row__context">
        Employer: Northwind Logistics
      </p>
    </div>
    <span class="pathable-activity-row__date">Mar 18</span>
    <span class="pathable-activity-row__owner">
      <span class="pathable-activity-row__owner-text">You</span>
    </span>
    <div class="pathable-activity-row__actions">
      <button type="button" class="pathable-button pathable-button--outline">
        View<span class="pathable-sr-only"> Job interview preparation</span>
      </button>
    </div>
  </li>
</ul>
