<!-- description: Rows without trailing actions. -->
<ul
  class="pathable-activity-list pathable-margin-0 pathable-padding-0"
  role="list"
  aria-label="Recent activity"
>
  <li class="pathable-activity-row">
    <span
      class="pathable-activity-row__status"
      data-status="completed"
      aria-hidden="true"
    ></span>
    <span class="pathable-activity-row__status-text">Completed</span>
    <div class="pathable-activity-row__body">
      <p class="pathable-activity-row__title">Placement confirmation</p>
      <p class="pathable-activity-row__context">Participant: David Kim</p>
    </div>
    <span class="pathable-activity-row__date">4:45 PM</span>
    <span class="pathable-activity-row__owner">
      <span class="pathable-activity-row__owner-text">You</span>
    </span>
  </li>
  <li class="pathable-activity-row">
    <span
      class="pathable-activity-row__status"
      data-status="pending"
      aria-hidden="true"
    ></span>
    <span class="pathable-activity-row__status-text">Pending</span>
    <div class="pathable-activity-row__body">
      <p class="pathable-activity-row__title">Training module assigned</p>
      <p class="pathable-activity-row__context">
        Module: Workplace Communication
      </p>
    </div>
    <span class="pathable-activity-row__date">10:30 AM</span>
    <span class="pathable-activity-row__owner">
      <span class="pathable-activity-row__owner-text">System</span>
    </span>
  </li>
</ul>
