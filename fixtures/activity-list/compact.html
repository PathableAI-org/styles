<!-- description: The compact density modifier, for dense dashboard panels. -->
<ul
  class="pathable-activity-list pathable-activity-list--compact pathable-margin-0 pathable-padding-0"
  role="list"
  aria-label="Recent activity"
>
  <li class="pathable-activity-row">
    <span
      class="pathable-activity-row__status"
      data-status="completed"
      aria-hidden="true"
    ></span>
    <span class="pathable-activity-row__status-text">Completed</span>
    <div class="pathable-activity-row__body">
      <p class="pathable-activity-row__title">Intake assessment</p>
      <p class="pathable-activity-row__context">Participant: Maria Gonzalez</p>
    </div>
    <span class="pathable-activity-row__date">2:30 PM</span>
    <span class="pathable-activity-row__owner">
      <span class="pathable-activity-row__owner-text">You</span>
    </span>
    <div class="pathable-activity-row__actions">
      <button type="button" class="pathable-button pathable-button--outline">
        View<span class="pathable-sr-only"> Intake assessment</span>
      </button>
    </div>
  </li>
  <li class="pathable-activity-row">
    <span
      class="pathable-activity-row__status"
      data-status="completed"
      aria-hidden="true"
    ></span>
    <span class="pathable-activity-row__status-text">Completed</span>
    <div class="pathable-activity-row__body">
      <p class="pathable-activity-row__title">Employment plan review</p>
      <p class="pathable-activity-row__context">Participant: James Chen</p>
    </div>
    <span class="pathable-activity-row__date">1:15 PM</span>
    <span class="pathable-activity-row__owner">
      <span class="pathable-activity-row__owner-text">You</span>
    </span>
    <div class="pathable-activity-row__actions">
      <button type="button" class="pathable-button pathable-button--outline">
        View<span class="pathable-sr-only"> Employment plan review</span>
      </button>
    </div>
  </li>
  <li class="pathable-activity-row">
    <span
      class="pathable-activity-row__status"
      data-status="pending"
      aria-hidden="true"
    ></span>
    <span class="pathable-activity-row__status-text">Pending</span>
    <div class="pathable-activity-row__body">
      <p class="pathable-activity-row__title">Benefits review</p>
      <p class="pathable-activity-row__context">Participant: Robert Torres</p>
    </div>
    <span class="pathable-activity-row__date">Mar 20</span>

      <button type="button" class="pathable-button pathable-button--outline">
        View<span class="pathable-sr-only"> Benefits review</span>
      </button>
    </div>
  </li>
</ul>
