name: Storybook Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'apps/storybook/**'
      - 'apps/storybook-react/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Shared build (styles + React + Storybooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup

      - name: Build styles
        run: pnpm --filter @pathableai/styles build

      - name: Build React
        run: pnpm --filter @pathableai/react build

      - name: Build HTML Storybook
        run: pnpm --filter @pathable/storybook build-storybook

      - name: Build React Storybook
        run: pnpm --filter @pathable/storybook-react build-storybook

      - name: Upload HTML Storybook static
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/
          retention-days: 1

      - name: Upload React Storybook static
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: storybook-react-static
          path: apps/storybook-react/storybook-static/
          retention-days: 1

  react-server-compatibility:
    name: React server compatibility (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup

      - name: Audit React server compatibility
        continue-on-error: true
        run: pnpm test:storybook-react-server

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: react-server-compatibility
          path: apps/storybook-react/test-results/server-compatibility.*
          if-no-files-found: warn

  accessibility-tests:
    name: Storybook accessibility tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download HTML Storybook static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Download React Storybook static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-react-static
          path: apps/storybook-react/storybook-static/

      - name: Test HTML Storybook
        run: |
          set +e
          npx serve -n -l 6006 apps/storybook/storybook-static &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6006/ 2>/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start"
              kill $SERVE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @pathable/storybook test-storybook --index-json --url http://127.0.0.1:6006
          TEST_EXIT=$?
          kill $SERVE_PID 2>/dev/null || true
          exit $TEST_EXIT

      - name: Test React Storybook
        run: |
          set +e
          npx serve -n -l 6007 apps/storybook-react/storybook-static &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6007/ 2>/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start"
              kill $SERVE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @pathable/storybook-react test-storybook --index-json --url http://127.0.0.1:6007
          TEST_EXIT=$?
          kill $SERVE_PID 2>/dev/null || true
          exit $TEST_EXIT

  visual-smoke:
    name: Storybook visual smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download HTML Storybook static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Visual smoke tests
        run: pnpm test:visual

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: visual-failures
          path: apps/storybook/test-results/visual-failures/
          if-no-files-found: ignore

  coverage:
    name: Storybook coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup

      - name: Download HTML Storybook static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Check storybook coverage
        run: pnpm storybook:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: storybook-coverage
          path: apps/storybook/test-results/storybook-coverage.*
          if-no-files-found: ignore

  quality-gates:
    name: Storybook Quality Gates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download HTML Storybook static
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Quality Gates
        run: pnpm quality-gates
