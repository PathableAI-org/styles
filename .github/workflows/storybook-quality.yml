name: Storybook Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The workflow runs on every pull request so its aggregate check always
  # reports. This job decides which Storybook jobs need to run:
  #   html_storybook   the HTML (styles) Storybook jobs
  #   react_storybook  the React Storybook jobs
  #   component_pages  the component-pages job, which checks component
  #                    pages (components/*.md) against the tests when the
  #                    HTML Storybook jobs do not run
  # Markdown outside the component pages changes no Storybook, so it runs
  # nothing here. The HTML Storybook renders one story per HTML fixture,
  # generated by scripts/component-docs, so fixtures and the generator run
  # its jobs. Patterns use picomatch with dot: true; `!(…)` excludes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      html_storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.html_storybook == 'true' }}
      react_storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react_storybook == 'true' }}
      component_pages: ${{ github.event_name != 'pull_request' || steps.filter.outputs.component_pages == 'true' }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/actions/setup/**'
              - '.github/workflows/storybook-quality.yml'
              - 'scripts/test-storybook-modal-css.mjs'
              - '**/*.mdx'
            # Everything the HTML Storybook consumes from packages/styles:
            # all but its Markdown, component pages and stories.
            styles_source: &styles_source
              - 'packages/styles/!(*.md)'
              - 'packages/styles/!(src|components|*.md)/**/!(*.md)'
              - 'packages/styles/src/!(*.md)'
              - 'packages/styles/src/!(stories|*.md)/**/!(*.md)'
            contracts: &contracts
              - 'packages/storybook-contracts/**/!(*.md)'
            html_storybook:
              - *shared
              - *styles_source
              - *contracts
              - 'packages/styles/src/stories/**'
              - 'apps/storybook/**/!(*.md)'
              - 'fixtures/**/!(*.md)'
              - 'scripts/component-docs/**/!(*.md)'
              - 'visual-baselines/**'
            # A change to styles source alone does not run the React
            # Storybook jobs: the HTML Storybook jobs test what the classes
            # do. The styles manifest still does, because React imports
            # styles through its exports. See
            # https://github.com/PathableAI-org/styles/issues/590.
            react_storybook:
              - *shared
              - 'packages/styles/package.json'
              - *contracts
              - 'packages/react/**/!(*.md)'
              - 'apps/storybook-react/**/!(*.md)'
            component_pages:
              - 'components/**'

  build:
    name: Shared build (styles + React + Storybooks)
    needs: changes
    if: >-
      needs.changes.outputs.html_storybook == 'true' ||
      needs.changes.outputs.react_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build styles
        run: pnpm --filter @pathableai/styles build

      - name: Component pages agree with the compiled CSS and pixel entries
        run: |
          pnpm --filter @pathableai/styles test:component-pages
          pnpm --filter @pathableai/styles check:component-pages

      - name: Build React
        run: pnpm --filter @pathableai/react build

      - name: Build HTML Storybook
        run: pnpm --filter @pathable/storybook build-storybook

      - name: Build React Storybook
        run: pnpm --filter @pathable/storybook-react build-storybook

      - name: Upload HTML Storybook static
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/
          retention-days: 1

      - name: Upload React Storybook static
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-react-static
          path: apps/storybook-react/storybook-static/
          retention-days: 1

  # Checks component pages when they changed but nothing the HTML Storybook
  # is built or tested from did, so the HTML Storybook jobs, which check them
  # too, do not run. The test runner's records then match those of the last
  # Docs Deploy run on main with the same inputs, which saves them under the
  # key scripts/component-pages-records-key.mjs prints. On a hit the job
  # checks the pages against those records; on a miss (the pull request is
  # behind main on those inputs, or that run has not finished) it builds and
  # tests the HTML Storybook itself.
  component-pages:
    name: Component pages
    needs: changes
    if: >-
      needs.changes.outputs.component_pages == 'true' &&
      needs.changes.outputs.html_storybook != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Component page records cache key
        id: records-key
        run: echo "key=$(node scripts/component-pages-records-key.mjs)" >> "$GITHUB_OUTPUT"

      - name: Restore component page records from main
        id: records
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/storybook/test-results/component-pages
            apps/storybook/storybook-static/index.json
          key: ${{ steps.records-key.outputs.key }}

      - uses: ./.github/actions/setup
        with:
          install_playwright: ${{ steps.records.outputs.cache-hit != 'true' }}

      - name: Build styles
        run: pnpm --filter @pathableai/styles build

      - name: Component pages agree with the compiled CSS and pixel entries
        run: |
          pnpm --filter @pathableai/styles test:component-pages
          pnpm --filter @pathableai/styles check:component-pages

      - name: Build and test the HTML Storybook (no records from main)
        if: steps.records.outputs.cache-hit != 'true'
        run: pnpm test:storybook-styles

      - name: Component page guarantees are covered by tests that ran
        run: pnpm --filter @pathableai/styles check:component-pages:executed

  accessibility-tests:
    name: Storybook accessibility tests
    needs: [changes, build]
    if: needs.changes.outputs.html_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download HTML Storybook static
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Test HTML Storybook
        run: |
          set +e
          npx serve -n -l 6006 apps/storybook/storybook-static &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6006/ 2>/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start"
              kill $SERVE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @pathable/storybook test-storybook --index-json --url http://127.0.0.1:6006
          TEST_EXIT=$?
          kill $SERVE_PID 2>/dev/null || true
          exit $TEST_EXIT

      - name: Component page guarantees are covered by tests that ran
        run: pnpm --filter @pathableai/styles check:component-pages:executed

  # The React Storybook accessibility run is its own job so it runs in
  # parallel with the HTML one instead of after it.
  accessibility-tests-react:
    name: Storybook accessibility tests (React)
    needs: [changes, build]
    if: needs.changes.outputs.react_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download React Storybook static
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-react-static
          path: apps/storybook-react/storybook-static/

      - name: Test React Storybook
        run: |
          set +e
          npx serve -n -l 6007 apps/storybook-react/storybook-static &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6007/ 2>/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start"
              kill $SERVE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @pathable/storybook-react test-storybook --index-json --url http://127.0.0.1:6007
          TEST_EXIT=$?
          kill $SERVE_PID 2>/dev/null || true
          exit $TEST_EXIT

  visual-smoke:
    name: Storybook visual smoke
    needs: [changes, build]
    if: needs.changes.outputs.html_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download HTML Storybook static
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Visual smoke tests
        run: pnpm test:visual

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-failures
          path: apps/storybook/test-results/visual-failures/
          if-no-files-found: ignore

  # Pixel comparison with committed baselines, only for the stories of the
  # components on the styles rollout list. Runs in the pinned Playwright
  # container through Docker (docs/testing/visual-regression.md).
  pixels-styles:
    name: Styles pixel visual regression
    needs: [changes, build]
    if: needs.changes.outputs.html_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Download HTML Storybook static
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Pixel visual regression
        run: pnpm test:pixels-styles

      - name: Upload expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pixels-styles
          path: apps/storybook/test-results/pixels/
          if-no-files-found: ignore

  # Backdrop / centering / dimming / focus-visible gates (FR-011 / SC-005).
  # Blank/overflow visual smoke alone is not sufficient — these runners are required on PRs.
  modal-backdrop-gates:
    name: Modal backdrop gates
    needs: [changes, build]
    if: needs.changes.outputs.html_storybook == 'true' || needs.changes.outputs.react_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download React Storybook static
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-react-static
          path: apps/storybook-react/storybook-static/

      - name: CSS-only Modal Storybook (no styles/js)
        run: pnpm test:storybook-modal-css

      - name: Modal open geometry (backdrop / center / dim / focus-visible)
        run: pnpm test:modal-open-geometry

  coverage:
    name: Storybook coverage
    needs: [changes, build]
    if: needs.changes.outputs.html_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Download HTML Storybook static
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Check storybook coverage
        run: pnpm storybook:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-coverage
          path: apps/storybook/test-results/storybook-coverage.*
          if-no-files-found: ignore

  quality-gates:
    name: Storybook Quality Gates
    needs: [changes, build]
    if: needs.changes.outputs.html_storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'

      - name: Download HTML Storybook static
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: storybook-html-static
          path: apps/storybook/storybook-static/

      - name: Quality Gates
        run: pnpm quality-gates

  # One aggregate check for the branch ruleset to require. It passes when
  # every needed job succeeded or was skipped by the path filters in the
  # changes job.
  storybook-result:
    name: Storybook result
    if: always()
    needs:
      - changes
      - build
      - component-pages
      - accessibility-tests
      - accessibility-tests-react
      - visual-smoke
      - pixels-styles
      - modal-backdrop-gates
      - coverage
      - quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$FAILED" = "true" ]; then
            echo "One or more needed jobs failed or were cancelled."
            exit 1
          fi
