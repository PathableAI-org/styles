name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create version PR or publish packages
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup npm trusted publishing client
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packed Next.js consumer
        run: pnpm test:next-consumer

      - name: Create version PR or publish to npm
        id: changesets
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
