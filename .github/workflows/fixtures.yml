name: Fixtures

# Validates the canonical HTML fixtures in fixtures/. Not a required check.
# Every check runs on every fixture folder. See docs/testing/fixtures.md.

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - 'components/*.md'
      - 'packages/styles/scripts/check-component-pages.mjs'
      - 'packages/styles/scripts/component-pages.mjs'
      - 'packages/styles/src/**'
      - 'packages/styles/package.json'
      # A dependency update (axe-core, html-validate, Playwright) can change
      # every result.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/actions/setup/**'
      - '.github/workflows/fixtures.yml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Folders whose axe step is held back by a maintainer-accepted exception,
  # each with its tracking issue. Every other check still runs for them.
  # Space-separated. Currently empty: no folder has an accepted exception.
  AXE_DEFERRED_FOLDERS: ''

jobs:
  fixtures:
    name: Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      # CI Full's Prettier job does not start for a pull request that changes
      # only HTML (its formattable filter has no *.html pattern), so the
      # fixtures are linted here. ESLint is not run: the folders hold only
      # HTML, which ESLint ignores, and CI Full's js-lint job lints the
      # harness (its js_fixtures filter).
      - name: Lint fixtures
        run: |
          pnpm exec markdownlint fixtures --ignore-path .markdownlintignore
          pnpm exec prettier --check fixtures
      - name: Test fixture harness
        run: pnpm --filter @pathableai/fixtures test
      - name: html-validate
        run: pnpm --filter @pathableai/fixtures check:html
      - name: Contract
        run: pnpm --filter @pathableai/fixtures check:contract
      # Every component folder, as allFolders() in harness/folders.mjs lists
      # them, except those in AXE_DEFERRED_FOLDERS.
      - name: axe
        working-directory: fixtures
        env:
          FIXTURES_AXE_REPORT: ${{ runner.temp }}/fixtures-axe-report.json
        run: |
          mapfile -t all < <(node --input-type=module \
            -e "import { allFolders } from './harness/folders.mjs'; console.log(allFolders().join('\n'))")
          folders=()
          for folder in "${all[@]}"; do
            case " $AXE_DEFERRED_FOLDERS " in
              *" $folder "*) echo "axe held back for $folder (see AXE_DEFERRED_FOLDERS)" ;;
              *) folders+=("$folder") ;;
            esac
          done
          node harness/axe.mjs "${folders[@]}"
      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fixtures-axe-report
          path: ${{ runner.temp }}/fixtures-axe-report.json
          if-no-files-found: ignore
