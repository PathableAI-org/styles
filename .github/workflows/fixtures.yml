name: Fixtures

# Validates the canonical HTML fixtures in fixtures/. Not a required check.
# See docs/testing/fixtures.md.

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - '.github/workflows/fixtures.yml'
      # A dependency update (axe-core, html-validate, Playwright) can change
      # every result, so it runs every folder before it merges.
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixtures:
    name: Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      # CI Full's lint jobs filter on packages/, apps/ and scripts/, so they
      # skip a pull request that changes only fixtures/.
      - name: Lint fixtures
        run: |
          pnpm exec eslint fixtures --max-warnings=0
          pnpm exec markdownlint fixtures --ignore-path .markdownlintignore
          pnpm exec prettier --check fixtures
      - name: Test fixture harness
        run: pnpm --filter @pathableai/fixtures test
      - name: Select changed fixture folders
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] &&
            git diff --quiet "origin/$BASE_REF...HEAD" -- .github/workflows/fixtures.yml pnpm-lock.yaml; then
            FOLDERS=$(node fixtures/harness/changed.mjs "origin/$BASE_REF")
          else
            # On main, or when this workflow or the lockfile changed, check
            # every folder.
            FOLDERS=$(node fixtures/harness/changed.mjs --all)
          fi
          FOLDERS=$(echo $FOLDERS)
          echo "Selected folders: ${FOLDERS:-none}"
          echo "folders=$FOLDERS" >> "$GITHUB_OUTPUT"
      - name: html-validate (every fixture)
        run: pnpm --filter @pathableai/fixtures check:html
      - name: Contract (every folder)
        run: pnpm --filter @pathableai/fixtures check:contract
      - name: axe (changed folders)
        if: steps.changed.outputs.folders != ''
        working-directory: fixtures
        env:
          FOLDERS: ${{ steps.changed.outputs.folders }}
          FIXTURES_AXE_REPORT: ${{ runner.temp }}/fixtures-axe-report.json
        run: node harness/axe.mjs $FOLDERS
      - name: Upload axe report
        if: always() && steps.changed.outputs.folders != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fixtures-axe-report
          path: ${{ runner.temp }}/fixtures-axe-report.json
          if-no-files-found: ignore
