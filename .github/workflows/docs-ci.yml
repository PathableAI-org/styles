name: Docs CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/storybook/**'
      - 'apps/storybook-react/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.storybook/**'
      - '**/*.stories.*'
      - '**/*.mdx'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      - name: Build docs
        run: |
          pnpm --filter @pathableai/react build
          STORYBOOK_BUILD=true pnpm --filter @pathable/storybook build-storybook
          pnpm --filter @pathable/storybook-react build-storybook
