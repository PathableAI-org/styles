# Weekly Spec Kit upgrade check via shared reusable workflow.
# Docs: https://github.com/PathableAI-org/github-workflows/blob/main/docs/speckit-upgrade.md
name: Spec Kit upgrade

on:
  schedule:
    # Wednesdays 14:00 UTC, offset from pre-ets (Mondays) so the PRs don't land together.
    - cron: '0 14 * * 3'
  workflow_dispatch:
    inputs:
      specify_version:
        description: 'Spec Kit version to upgrade to (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    uses: PathableAI-org/github-workflows/.github/workflows/speckit-upgrade.yml@9589b629eaaea51e2b762b83644164599c96119d
    with:
      specify_version: ${{ inputs.specify_version }}
      # .claude/skills/ is deliberately absent: the claude integration is not
      # installed, so the upgrade never writes there. The .claude/skills/speckit-*
      # symlinks pick up whatever it refreshes in .agents/skills/.
      add_paths: |
        .specify/
        .agents/skills/
