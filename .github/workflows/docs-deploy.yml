name: Docs Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build styles
        run: pnpm --filter @pathableai/styles build

      # Single build for Pages (base path /styles/); the Storybook has no
      # React ref any more, so a separate unprefixed build is not needed.
      - name: Build docs for Pages
        run: STORYBOOK_BUILD=true pnpm --filter @pathable/storybook build-storybook

      - name: Token custom property lint
        run: pnpm lint:tokens

      # The accessibility test run writes the component page records that the
      # two steps below save. Pull requests that change only component pages
      # restore these records instead of building and testing the HTML
      # Storybook (Storybook Quality's component-pages job). Saved before the
      # Pages rebuild below rewrites index.json, so the records stay newer
      # than the index. All three are disabled with that job until
      # check:component-pages:executed passes; re-enable them together. Pull
      # requests already run these accessibility tests (Storybook Quality's
      # accessibility-tests job).
      - name: Storybook accessibility tests
        if: false
        run: |
          set +e
          npx serve -n -l 6006 apps/storybook/storybook-static &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6006/ 2>/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start"
              kill $SERVE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @pathable/storybook test-storybook --index-json --url http://127.0.0.1:6006
          TEST_EXIT=$?
          kill $SERVE_PID 2>/dev/null || true
          exit $TEST_EXIT

      - name: Component page records cache key
        if: false
        id: records-key
        run: echo "key=$(node scripts/component-pages-records-key.mjs)" >> "$GITHUB_OUTPUT"

      - name: Save component page records
        if: false
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/storybook/test-results/component-pages
            apps/storybook/storybook-static/index.json
          key: ${{ steps.records-key.outputs.key }}

      - name: Create .nojekyll
        run: touch apps/storybook/storybook-static/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/storybook/storybook-static

  deploy:
    needs: build
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
