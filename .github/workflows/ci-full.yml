name: CI Full

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js == 'true' }}
      js_fixtures: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_fixtures == 'true' }}
      js_styles: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_styles == 'true' }}
      js_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_react == 'true' }}
      js_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_contracts == 'true' }}
      js_app_storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_app_storybook == 'true' }}
      js_app_storybook_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_app_storybook_react == 'true' }}
      js_root_scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_root_scripts == 'true' }}
      js_config: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_config == 'true' }}
      stylelint: ${{ github.event_name != 'pull_request' || steps.filter.outputs.stylelint == 'true' }}
      formattable: ${{ github.event_name != 'pull_request' || steps.filter.outputs.formattable == 'true' }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            js:
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.mjs'
              - 'apps/**/*.cjs'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'fixtures/**/*.mjs'
              - 'scripts/**'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
              - 'eslint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci-full.yml'
            js_fixtures:
              - 'fixtures/**/*.mjs'
            js_styles:
              - 'packages/styles/**/*.js'
              - 'packages/styles/**/*.jsx'
              - 'packages/styles/**/*.ts'
              - 'packages/styles/**/*.tsx'
              - 'packages/styles/**/*.mjs'
              - 'packages/styles/**/*.cjs'
            js_react:
              - 'packages/react/**/*.js'
              - 'packages/react/**/*.jsx'
              - 'packages/react/**/*.ts'
              - 'packages/react/**/*.tsx'
              - 'packages/react/**/*.mjs'
              - 'packages/react/**/*.cjs'
            js_contracts:
              - 'packages/storybook-contracts/**/*.js'
              - 'packages/storybook-contracts/**/*.jsx'
              - 'packages/storybook-contracts/**/*.ts'
              - 'packages/storybook-contracts/**/*.tsx'
              - 'packages/storybook-contracts/**/*.mjs'
              - 'packages/storybook-contracts/**/*.cjs'
            js_app_storybook:
              - 'apps/storybook/**/*.js'
              - 'apps/storybook/**/*.jsx'
              - 'apps/storybook/**/*.ts'
              - 'apps/storybook/**/*.tsx'
              - 'apps/storybook/**/*.mjs'
              - 'apps/storybook/**/*.cjs'
            js_app_storybook_react:
              - 'apps/storybook-react/**/*.js'
              - 'apps/storybook-react/**/*.jsx'
              - 'apps/storybook-react/**/*.ts'
              - 'apps/storybook-react/**/*.tsx'
              - 'apps/storybook-react/**/*.mjs'
              - 'apps/storybook-react/**/*.cjs'
            js_root_scripts:
              - 'scripts/**'
              - '.github/**'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
            js_config:
              - 'eslint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
            # pnpm lint:styles lints packages/styles/src/**/*.scss; the token
            # lint also reads the styles stories and the React theme files.
            stylelint:
              - 'packages/**/*.scss'
              - 'packages/**/*.sass'
              - 'packages/**/*.css'
              - 'packages/styles/src/**'
              - 'packages/styles/scripts/lint-tokens.mjs'
              - 'packages/react/src/theme/**'
              - 'packages/**/.stylelintrc*'
              - '.stylelintrc.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            formattable:
              - '**/*.scss'
              - '**/*.sass'
              - '**/*.css'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.md'
              - '.prettierrc'
              - '.prettierignore'
              - 'package.json'
              - 'pnpm-lock.yaml'

  js-lint:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    name: JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # test:tooling launches Chromium (scripts/tests/visual-capture.test.mjs).
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'
      - name: Build ESLint scope
        id: scope
        run: |
          SCOPE=""
          FALLBACK=false

          if [ "${{ needs.changes.outputs.js_config }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "${{ needs.changes.outputs.js_root_scripts }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "$FALLBACK" = "true" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.js_styles }}" = "true" ]; then
            SCOPE="$SCOPE packages/styles"
          fi
          if [ "${{ needs.changes.outputs.js_react }}" = "true" ]; then
            SCOPE="$SCOPE packages/react"
          fi
          if [ "${{ needs.changes.outputs.js_contracts }}" = "true" ]; then
            SCOPE="$SCOPE packages/storybook-contracts"
          fi
          if [ "${{ needs.changes.outputs.js_app_storybook }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook"
          fi
          if [ "${{ needs.changes.outputs.js_app_storybook_react }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook-react"
          fi
          if [ "${{ needs.changes.outputs.js_fixtures }}" = "true" ]; then
            SCOPE="$SCOPE fixtures"
          fi

          if [ -z "$SCOPE" ]; then
            SCOPE="."
          fi

          echo "path=$SCOPE" >> "$GITHUB_OUTPUT"
      - name: Restore ESLint cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: JS lint
        run: pnpm exec eslint ${{ steps.scope.outputs.path }} --max-warnings=0 --cache --cache-location .eslintcache
      - name: Test repository tooling
        run: pnpm test:tooling
      - name: Save ESLint cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

  markdownlint:
    needs: changes
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Markdownlint
        run: pnpm lint:md

  # On a pull request it lints only the changed .scss files.
  stylelint:
    needs: changes
    if: needs.changes.outputs.stylelint == 'true'
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is
          # the base, so two commits are enough to list the changed files.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: ./.github/actions/setup
      # On a pull request, stylelint lints only the .scss files the pull
      # request changed (in the scope of pnpm lint:styles), unless the pull
      # request changed stylelint's configuration or dependencies. Elsewhere,
      # and in that case, it lints the whole package.
      - name: Lint styles
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            pnpm lint:styles
            exit 0
          fi
          # Each fails the step if git cannot list the changes. The
          # configuration check reads every changed path, deletions included,
          # so deleting a stylelint config also lints the whole package; only
          # the files to lint leave deletions out.
          changed=$(git diff --name-only HEAD^1 HEAD)
          remaining=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
          if grep -qE '(^|/)\.stylelint(rc[^/]*|ignore)$|(^|/)package\.json$|^pnpm-(lock|workspace)\.yaml$' <<< "$changed"; then
            echo "Stylelint configuration or dependencies changed; linting the whole package."
            pnpm lint:styles
            exit 0
          fi
          mapfile -t files < <(grep -E '^packages/styles/src/.*\.scss$' <<< "$remaining" || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .scss file under packages/styles/src changed; stylelint has nothing to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} changed .scss file(s):"
          printf '  %s\n' "${files[@]}"
          pnpm exec stylelint "${files[@]}"
      # The token lint reads across files, so it always runs whole-package.
      - name: Token custom property lint
        run: pnpm lint:tokens

  format:
    needs: changes
    if: needs.changes.outputs.formattable == 'true'
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Restore Prettier cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .prettiercache
          key: prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            prettier-${{ runner.os }}-
      - name: Check formatting
        run: pnpm check:format
      - name: Save Prettier cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .prettiercache
          key: prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

  # One aggregate check for the branch ruleset to require. It passes when
  # every needed job succeeded or was skipped by its path filter.
  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - js-lint
      - markdownlint
      - stylelint
      - format
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$FAILED" = "true" ]; then
            echo "One or more needed jobs failed or were cancelled."
            exit 1
          fi
