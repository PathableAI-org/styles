name: CI Full

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js == 'true' }}
      js_styles: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_styles == 'true' }}
      js_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_react == 'true' }}
      js_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_contracts == 'true' }}
      js_app_storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_app_storybook == 'true' }}
      js_app_storybook_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_app_storybook_react == 'true' }}
      js_root_scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_root_scripts == 'true' }}
      js_config: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_config == 'true' }}
      markdown: ${{ github.event_name != 'pull_request' || steps.filter.outputs.markdown == 'true' }}
      md_styles: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_styles == 'true' }}
      md_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_react == 'true' }}
      md_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_contracts == 'true' }}
      md_app_storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_app_storybook == 'true' }}
      md_app_storybook_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_app_storybook_react == 'true' }}
      md_root: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_root == 'true' }}
      md_docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_docs == 'true' }}
      md_config: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_config == 'true' }}
      react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react == 'true' }}
      behavior_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.behavior_contracts == 'true' }}
      next_consumer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.next_consumer == 'true' }}
      storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.storybook == 'true' }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            js:
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.mjs'
              - 'apps/**/*.cjs'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'scripts/**'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
              - 'eslint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
            js_styles:
              - 'packages/styles/**/*.js'
              - 'packages/styles/**/*.jsx'
              - 'packages/styles/**/*.ts'
              - 'packages/styles/**/*.tsx'
              - 'packages/styles/**/*.mjs'
              - 'packages/styles/**/*.cjs'
            js_react:
              - 'packages/react/**/*.js'
              - 'packages/react/**/*.jsx'
              - 'packages/react/**/*.ts'
              - 'packages/react/**/*.tsx'
              - 'packages/react/**/*.mjs'
              - 'packages/react/**/*.cjs'
            js_contracts:
              - 'packages/storybook-contracts/**/*.js'
              - 'packages/storybook-contracts/**/*.jsx'
              - 'packages/storybook-contracts/**/*.ts'
              - 'packages/storybook-contracts/**/*.tsx'
              - 'packages/storybook-contracts/**/*.mjs'
              - 'packages/storybook-contracts/**/*.cjs'
            js_app_storybook:
              - 'apps/storybook/**/*.js'
              - 'apps/storybook/**/*.jsx'
              - 'apps/storybook/**/*.ts'
              - 'apps/storybook/**/*.tsx'
              - 'apps/storybook/**/*.mjs'
              - 'apps/storybook/**/*.cjs'
            js_app_storybook_react:
              - 'apps/storybook-react/**/*.js'
              - 'apps/storybook-react/**/*.jsx'
              - 'apps/storybook-react/**/*.ts'
              - 'apps/storybook-react/**/*.tsx'
              - 'apps/storybook-react/**/*.mjs'
              - 'apps/storybook-react/**/*.cjs'
            js_root_scripts:
              - 'scripts/**'
              - '.github/**'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
            js_config:
              - 'eslint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
            markdown:
              - 'apps/**/*.md'
              - 'packages/**/*.md'
              - 'docs/**/*.md'
              - '*.md'
              - '.markdownlint.json'
              - '.markdownlintignore'
            md_styles:
              - 'packages/styles/**/*.md'
            md_react:
              - 'packages/react/**/*.md'
            md_contracts:
              - 'packages/storybook-contracts/**/*.md'
            md_app_storybook:
              - 'apps/storybook/**/*.md'
            md_app_storybook_react:
              - 'apps/storybook-react/**/*.md'
            md_root:
              - '*.md'
            md_docs:
              - 'docs/**/*.md'
            md_config:
              - '.markdownlint.json'
              - '.markdownlintignore'
            react:
              - 'packages/react/**'
              - 'packages/styles/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            next_consumer:
              - 'scripts/test-next-consumer.mjs'
              - 'packages/react/**'
              - 'packages/styles/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            storybook:
              - 'apps/storybook/**'
              - 'apps/storybook-react/**'
              - 'packages/**'
              - '.storybook/**'
              - '**/*.stories.*'
              - '**/*.mdx'
              - 'package.json'
              - 'pnpm-lock.yaml'

  js-lint:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    name: JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build ESLint scope
        id: scope
        run: |
          SCOPE=""
          FALLBACK=false

          if [ "${{ needs.changes.outputs.js_config }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "${{ needs.changes.outputs.js_root_scripts }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "$FALLBACK" = "true" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.js_styles }}" = "true" ]; then
            SCOPE="$SCOPE packages/styles"
          fi
          if [ "${{ needs.changes.outputs.js_react }}" = "true" ]; then
            SCOPE="$SCOPE packages/react"
          fi
          if [ "${{ needs.changes.outputs.js_contracts }}" = "true" ]; then
            SCOPE="$SCOPE packages/storybook-contracts"
          fi
          if [ "${{ needs.changes.outputs.js_app_storybook }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook"
          fi
          if [ "${{ needs.changes.outputs.js_app_storybook_react }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook-react"
          fi

          if [ -z "$SCOPE" ]; then
            SCOPE="."
          fi

          echo "path=$SCOPE" >> "$GITHUB_OUTPUT"
      - name: Restore ESLint cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: JS lint
        run: pnpm exec eslint ${{ steps.scope.outputs.path }} --max-warnings=0 --cache --cache-location .eslintcache
      - name: Save ESLint cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

  markdownlint:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build Markdownlint scope
        id: scope
        run: |
          SCOPE=""
          FALLBACK=false

          if [ "${{ needs.changes.outputs.md_config }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "${{ needs.changes.outputs.md_root }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "${{ needs.changes.outputs.md_docs }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "$FALLBACK" = "true" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.md_styles }}" = "true" ]; then
            SCOPE="$SCOPE packages/styles"
          fi
          if [ "${{ needs.changes.outputs.md_react }}" = "true" ]; then
            SCOPE="$SCOPE packages/react"
          fi
          if [ "${{ needs.changes.outputs.md_contracts }}" = "true" ]; then
            SCOPE="$SCOPE packages/storybook-contracts"
          fi
          if [ "${{ needs.changes.outputs.md_app_storybook }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook"
          fi
          if [ "${{ needs.changes.outputs.md_app_storybook_react }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook-react"
          fi

          if [ -z "$SCOPE" ]; then
            SCOPE="."
          fi

          echo "path=$SCOPE" >> "$GITHUB_OUTPUT"
      - name: Markdownlint
        run: pnpm exec markdownlint ${{ steps.scope.outputs.path }} --ignore-path .markdownlintignore

  react-typecheck:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    name: React typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Typecheck React
        run: pnpm --filter @pathableai/react typecheck

  react-build:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    name: React build + package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      - name: Build React
        run: pnpm --filter @pathableai/react build
      - name: Validate package
        run: pnpm --filter @pathableai/react check:package
      - name: Validate types
        run: pnpm --filter @pathableai/react check:types

  next-consumer:
    needs: changes
    if: needs.changes.outputs.next_consumer == 'true'
    name: Packed Next.js consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Validate packed Next.js consumer
        run: pnpm test:next-consumer

  storybook-build:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    name: Storybook build (HTML + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      - name: Build React package
        run: pnpm --filter @pathableai/react build
      - name: Build HTML Storybook
        run: pnpm --filter @pathable/storybook build-storybook
      - name: Build React Storybook
        run: pnpm --filter @pathable/storybook-react build-storybook
