name: CI Full

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js == 'true' }}
      js_styles: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_styles == 'true' }}
      js_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_react == 'true' }}
      js_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_contracts == 'true' }}
      js_app_storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_app_storybook == 'true' }}
      js_app_storybook_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_app_storybook_react == 'true' }}
      js_root_scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_root_scripts == 'true' }}
      js_config: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js_config == 'true' }}
      markdown: ${{ github.event_name != 'pull_request' || steps.filter.outputs.markdown == 'true' }}
      md_styles: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_styles == 'true' }}
      md_components: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_components == 'true' }}
      md_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_react == 'true' }}
      md_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_contracts == 'true' }}
      md_app_storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_app_storybook == 'true' }}
      md_app_storybook_react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_app_storybook_react == 'true' }}
      md_root: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_root == 'true' }}
      md_docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_docs == 'true' }}
      md_config: ${{ github.event_name != 'pull_request' || steps.filter.outputs.md_config == 'true' }}
      react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react == 'true' }}
      react_build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react_build == 'true' }}
      behavior_contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.behavior_contracts == 'true' }}
      next_consumer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.next_consumer == 'true' }}
      stylelint: ${{ github.event_name != 'pull_request' || steps.filter.outputs.stylelint == 'true' }}
      formattable: ${{ github.event_name != 'pull_request' || steps.filter.outputs.formattable == 'true' }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            js:
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.mjs'
              - 'apps/**/*.cjs'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'scripts/**'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
              - 'eslint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
            js_styles:
              - 'packages/styles/**/*.js'
              - 'packages/styles/**/*.jsx'
              - 'packages/styles/**/*.ts'
              - 'packages/styles/**/*.tsx'
              - 'packages/styles/**/*.mjs'
              - 'packages/styles/**/*.cjs'
            js_react:
              - 'packages/react/**/*.js'
              - 'packages/react/**/*.jsx'
              - 'packages/react/**/*.ts'
              - 'packages/react/**/*.tsx'
              - 'packages/react/**/*.mjs'
              - 'packages/react/**/*.cjs'
            js_contracts:
              - 'packages/storybook-contracts/**/*.js'
              - 'packages/storybook-contracts/**/*.jsx'
              - 'packages/storybook-contracts/**/*.ts'
              - 'packages/storybook-contracts/**/*.tsx'
              - 'packages/storybook-contracts/**/*.mjs'
              - 'packages/storybook-contracts/**/*.cjs'
            js_app_storybook:
              - 'apps/storybook/**/*.js'
              - 'apps/storybook/**/*.jsx'
              - 'apps/storybook/**/*.ts'
              - 'apps/storybook/**/*.tsx'
              - 'apps/storybook/**/*.mjs'
              - 'apps/storybook/**/*.cjs'
            js_app_storybook_react:
              - 'apps/storybook-react/**/*.js'
              - 'apps/storybook-react/**/*.jsx'
              - 'apps/storybook-react/**/*.ts'
              - 'apps/storybook-react/**/*.tsx'
              - 'apps/storybook-react/**/*.mjs'
              - 'apps/storybook-react/**/*.cjs'
            js_root_scripts:
              - 'scripts/**'
              - '.github/**'
              - '*.js'
              - '*.mjs'
              - '*.cjs'
            js_config:
              - 'eslint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
            markdown:
              - 'apps/**/*.md'
              - 'packages/**/*.md'
              - 'components/**/*.md'
              - 'docs/**/*.md'
              - '*.md'
              - '.markdownlint.json'
              - '.markdownlintignore'
            md_styles:
              - 'packages/styles/**/*.md'
            md_components:
              - 'components/**/*.md'
            md_react:
              - 'packages/react/**/*.md'
            md_contracts:
              - 'packages/storybook-contracts/**/*.md'
            md_app_storybook:
              - 'apps/storybook/**/*.md'
            md_app_storybook_react:
              - 'apps/storybook-react/**/*.md'
            md_root:
              - '*.md'
            md_docs:
              - 'docs/**/*.md'
            md_config:
              - '.markdownlint.json'
              - '.markdownlintignore'
            # React source the build, typecheck and unit tests read: all
            # of packages/react but its Markdown and stories (tsconfig and
            # vitest exclude src/stories). Patterns use picomatch with
            # dot: true; `!(…)` excludes.
            react_source: &react_source
              - 'packages/react/!(*.md)'
              - 'packages/react/!(src|*.md)/**/!(*.md)'
              - 'packages/react/src/!(*.md)'
              - 'packages/react/src/!(stories|*.md)/**/!(*.md)'
            # The styles package manifest. React imports styles through its
            # exports, so its entry points and dependencies can break the
            # React build, tests and packed consumers. A change to styles
            # source alone runs no React job: the styles jobs test what the
            # classes do, and the token lint (stylelint) checks the React
            # theme files against the styles tokens. See
            # https://github.com/PathableAI-org/styles/issues/590.
            styles_package: &styles_package
              - 'packages/styles/package.json'
            # Markdown that check:agent-guidance validates and the packed
            # consumer test checks in the React tarball.
            agent_guidance: &agent_guidance
              - 'packages/react/README.md'
              - 'packages/react/agent-guidance/**'
              - 'scripts/check-agent-guidance.mjs'
              - 'scripts/check-agent-guidance*.test.mjs'
            react:
              - *react_source
              - *styles_package
              - '.github/actions/setup/**'
              - '.github/workflows/ci-full.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            # check:agent-guidance also fails when the committed React
            # component pages differ from what scripts/component-docs
            # generates from the source pages and fixtures.
            react_build:
              - *react_source
              - *styles_package
              - *agent_guidance
              - 'components/**'
              - 'fixtures/**/*.html'
              - 'scripts/component-docs/**'
              - '.github/actions/setup/**'
              - '.github/workflows/ci-full.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            next_consumer:
              - *react_source
              - *styles_package
              - *agent_guidance
              - 'scripts/test-next-consumer.mjs'
              - 'scripts/fixtures/next-consumer/**'
              - '.github/actions/setup/**'
              - '.github/workflows/ci-full.yml'
              - '.gitattributes'
              - '.npmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # pnpm lint:styles lints packages/styles/src/**/*.scss; the token
            # lint also reads the styles stories and the React theme files.
            stylelint:
              - 'packages/**/*.scss'
              - 'packages/**/*.sass'
              - 'packages/**/*.css'
              - 'packages/styles/src/**'
              - 'packages/styles/scripts/lint-tokens.mjs'
              - 'packages/react/src/theme/**'
              - 'packages/**/.stylelintrc*'
              - '.stylelintrc.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            formattable:
              - '**/*.scss'
              - '**/*.sass'
              - '**/*.css'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.md'
              - '.prettierrc'
              - '.prettierignore'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # Only the ESLint steps are disabled here; the repository tooling tests still run.
  js-lint:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    name: JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Disabled for the component reset (PR #607); re-enable when the SCSS catches up.
      - name: Build ESLint scope
        if: false
        id: scope
        run: |
          SCOPE=""
          FALLBACK=false

          if [ "${{ needs.changes.outputs.js_config }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "${{ needs.changes.outputs.js_root_scripts }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "$FALLBACK" = "true" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.js_styles }}" = "true" ]; then
            SCOPE="$SCOPE packages/styles"
          fi
          if [ "${{ needs.changes.outputs.js_react }}" = "true" ]; then
            SCOPE="$SCOPE packages/react"
          fi
          if [ "${{ needs.changes.outputs.js_contracts }}" = "true" ]; then
            SCOPE="$SCOPE packages/storybook-contracts"
          fi
          if [ "${{ needs.changes.outputs.js_app_storybook }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook"
          fi
          if [ "${{ needs.changes.outputs.js_app_storybook_react }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook-react"
          fi

          if [ -z "$SCOPE" ]; then
            SCOPE="."
          fi

          echo "path=$SCOPE" >> "$GITHUB_OUTPUT"
      # Disabled for the component reset (PR #607); re-enable when the SCSS catches up.
      - name: Restore ESLint cache
        if: false
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      # Disabled for the component reset (PR #607); re-enable when the SCSS catches up.
      - name: JS lint
        if: false
        run: pnpm exec eslint ${{ steps.scope.outputs.path }} --max-warnings=0 --cache --cache-location .eslintcache
      - name: Test repository tooling
        run: pnpm test:tooling
      # Disabled for the component reset (PR #607); re-enable when the SCSS catches up.
      - name: Save ESLint cache
        if: false
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

  # Disabled for the component reset (PR #607); re-enable when the SCSS catches up.
  markdownlint:
    needs: changes
    if: false
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build Markdownlint scope
        id: scope
        run: |
          SCOPE=""
          FALLBACK=false

          if [ "${{ needs.changes.outputs.md_config }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "${{ needs.changes.outputs.md_root }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "${{ needs.changes.outputs.md_docs }}" = "true" ]; then
            FALLBACK=true
          fi

          if [ "$FALLBACK" = "true" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.md_styles }}" = "true" ]; then
            SCOPE="$SCOPE packages/styles"
          fi
          if [ "${{ needs.changes.outputs.md_components }}" = "true" ]; then
            SCOPE="$SCOPE components"
          fi
          if [ "${{ needs.changes.outputs.md_react }}" = "true" ]; then
            SCOPE="$SCOPE packages/react"
          fi
          if [ "${{ needs.changes.outputs.md_contracts }}" = "true" ]; then
            SCOPE="$SCOPE packages/storybook-contracts"
          fi
          if [ "${{ needs.changes.outputs.md_app_storybook }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook"
          fi
          if [ "${{ needs.changes.outputs.md_app_storybook_react }}" = "true" ]; then
            SCOPE="$SCOPE apps/storybook-react"
          fi

          if [ -z "$SCOPE" ]; then
            SCOPE="."
          fi

          echo "path=$SCOPE" >> "$GITHUB_OUTPUT"
      - name: Markdownlint
        run: pnpm exec markdownlint ${{ steps.scope.outputs.path }} --ignore-path .markdownlintignore

  # Disabled for the component reset (PR #607); re-enable when the SCSS catches up.
  stylelint:
    needs: changes
    if: false
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is
          # the base, so two commits are enough to list the changed files.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: ./.github/actions/setup
      # On a pull request, stylelint lints only the .scss files the pull
      # request changed (in the scope of pnpm lint:styles), unless the pull
      # request changed stylelint's configuration or dependencies. Elsewhere,
      # and in that case, it lints the whole package.
      - name: Lint styles
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            pnpm lint:styles
            exit 0
          fi
          # Each fails the step if git cannot list the changes. The
          # configuration check reads every changed path, deletions included,
          # so deleting a stylelint config also lints the whole package; only
          # the files to lint leave deletions out.
          changed=$(git diff --name-only HEAD^1 HEAD)
          remaining=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
          if grep -qE '(^|/)\.stylelint(rc[^/]*|ignore)$|(^|/)package\.json$|^pnpm-(lock|workspace)\.yaml$' <<< "$changed"; then
            echo "Stylelint configuration or dependencies changed; linting the whole package."
            pnpm lint:styles
            exit 0
          fi
          mapfile -t files < <(grep -E '^packages/styles/src/.*\.scss$' <<< "$remaining" || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .scss file under packages/styles/src changed; stylelint has nothing to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} changed .scss file(s):"
          printf '  %s\n' "${files[@]}"
          pnpm exec stylelint "${files[@]}"
      # The token lint reads across files, so it always runs whole-package.
      - name: Token custom property lint
        run: pnpm lint:tokens

  # Disabled for the component reset (PR #607); re-enable when the SCSS catches up.
  format:
    needs: changes
    if: false
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Restore Prettier cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .prettiercache
          key: prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            prettier-${{ runner.os }}-
      - name: Check formatting
        run: pnpm check:format
      - name: Save Prettier cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .prettiercache
          key: prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

  react-typecheck:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    name: React unit tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Test React
        run: pnpm --filter @pathableai/react test:unit
      - name: Typecheck React
        run: pnpm --filter @pathableai/react typecheck
      - name: Audit React server compatibility (advisory)
        if: always()
        continue-on-error: true
        run: pnpm test:storybook-react-server
      - name: Upload server compatibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: react-server-compatibility
          path: apps/storybook-react/test-results/server-compatibility.*
          if-no-files-found: warn

  react-build:
    needs: changes
    if: needs.changes.outputs.react_build == 'true'
    name: React build + package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      - name: Build React
        run: pnpm --filter @pathableai/react build
      - name: Validate package
        run: pnpm --filter @pathableai/react check:package
      - name: Validate types
        run: pnpm --filter @pathableai/react check:types
      - name: Validate agent guidance
        run: pnpm check:agent-guidance

  next-consumer:
    needs: changes
    if: needs.changes.outputs.next_consumer == 'true'
    name: Packed consumer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: next15-react18-linux
            os: ubuntu-latest
            fixture: next15-react18
          - label: next16-react19-linux
            os: ubuntu-latest
            fixture: next16-react19
          - label: next16-react19-windows
            os: windows-latest
            fixture: next16-react19
    env:
      NEXT_CONSUMER_FIXTURE: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install_playwright: 'true'
      - name: Validate packed Next.js consumer
        run: pnpm test:next-consumer

  agent-guidance-impact:
    if: github.event_name == 'pull_request'
    name: Agent guidance impact (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Review agent guidance impact
        run: >-
          node scripts/check-agent-guidance-impact.mjs
          --base origin/${{ github.base_ref }}
          --head ${{ github.sha }}

  # One aggregate check for the branch ruleset to require. It passes when
  # every needed job succeeded or was skipped by its path filter. The
  # advisory agent guidance job is left out on purpose.
  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - js-lint
      - markdownlint
      - stylelint
      - format
      - react-typecheck
      - react-build
      - next-consumer
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$FAILED" = "true" ]; then
            echo "One or more needed jobs failed or were cancelled."
            exit 1
          fi
