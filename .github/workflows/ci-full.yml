name: CI Full

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js == 'true' }}
      markdown: ${{ github.event_name != 'pull_request' || steps.filter.outputs.markdown == 'true' }}
      react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react == 'true' }}
      behavior-contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.behavior-contracts == 'true' }}
      next-consumer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.next-consumer == 'true' }}
      storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.storybook == 'true' }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            js:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'eslint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
            markdown:
              - '**/*.md'
              - '.markdownlint.json'
              - '.markdownlintignore'
            react:
              - 'packages/react/**'
              - 'packages/styles/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            behavior-contracts:
              - 'behavior-contracts/**'
              - 'packages/styles/**'
              - 'apps/storybook/**'
              - 'apps/storybook-react/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            next-consumer:
              - 'scripts/test-next-consumer.mjs'
              - 'packages/react/**'
              - 'packages/styles/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            storybook:
              - 'apps/storybook/**'
              - 'apps/storybook-react/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  js-lint:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    name: JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: JS lint
        run: pnpm lint:js

  markdownlint:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Markdownlint
        run: pnpm lint:md

  react-typecheck:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    name: React typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Typecheck React
        run: pnpm --filter @pathableai/react typecheck

  react-build:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    name: React build + package validation
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      - name: Build React
        run: pnpm --filter @pathableai/react build
      - name: Validate package
        run: pnpm --filter @pathableai/react check:package
      - name: Validate types
        run: pnpm --filter @pathableai/react check:types

  behavior-contracts:
    needs: changes
    if: needs.changes.outputs.behavior-contracts == 'true'
    name: Behavior contracts
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
        with:
          install-playwright: 'true'
      - name: Test behavior contracts
        run: pnpm test:contracts

  next-consumer:
    needs: changes
    if: needs.changes.outputs.next-consumer == 'true'
    name: Packed Next.js consumer
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Validate packed Next.js consumer
        run: pnpm test:next-consumer

  storybook-build:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    name: Storybook build (HTML + React)
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Build styles
        run: pnpm --filter @pathableai/styles build
      - name: Build React package
        run: pnpm --filter @pathableai/react build
      - name: Build HTML Storybook
        run: pnpm --filter @pathable/storybook build-storybook
      - name: Build React Storybook
        run: pnpm --filter @pathable/storybook-react build-storybook