name: Setup workspace
description: Set up pnpm + Node.js, install dependencies, optionally install Playwright.

inputs:
  install_playwright:
    description: Whether to install Playwright browsers with system deps.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: pnpm

    - name: Configure Playwright browser path
      if: inputs.install_playwright == 'true'
      shell: bash
      run: echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

    - name: Cache Playwright browsers
      if: inputs.install_playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # No --with-deps: the hosted runner image already has every library
    # Chromium needs, and --with-deps only adds an apt-get update plus extra
    # font packages that are not cached and have taken up to five minutes to
    # download. Pixel baselines render inside the pinned Playwright container,
    # so they do not depend on the runner's fonts.
    - name: Install Playwright browser
      if: inputs.install_playwright == 'true'
      shell: bash
      run: pnpm exec playwright install chromium
